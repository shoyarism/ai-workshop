name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ⚖️ Slop Court & System Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Slop Court Unit Tests
        run: |
          python tests/test_court.py

      - name: Verify Secret & Credential Invariants
        run: |
          python scripts/scan_secrets.py

      - name: Run Workshop Doctor Diagnostics
        run: |
          python scripts/workshop.py doctor
