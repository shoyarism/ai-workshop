<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <!-- =================================================================
       WORKSHOP OS Slop Court v3.5 (Animated)
       Apple Minimalist Design Language
       ================================================================= -->
  <style>
    .section-title { font-family: "SF Pro Display", Georgia, serif; font-weight: 800; font-size: 20px; fill: #111111; letter-spacing: -0.01em; }
    .section-tag { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; fill: #555555; }
    .mono-meta { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 10px; fill: #888888; letter-spacing: 0.5px; }
    .mono-bold { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; }
    .verdict-title { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 11px; font-weight: 800; letter-spacing: 1px; }
    .verdict-line { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 11px; fill: #555555; }
    .juror-title { font-family: "SF Pro Display", Georgia, serif; font-weight: 800; font-size: 14px; fill: #111111; letter-spacing: -0.01em; }
    .juror-tag { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; fill: #555555; }
    .item-bullet { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-weight: 500; font-size: 11px; fill: #555555; }

    /* Animation Keyframes */
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes pulseDot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.6; } }
  </style>

  <!-- Background: Clean white canvas -->
  <rect width="1200" height="520" fill="#fdfdfd"/>

  <!-- Vertical divider -->
  <line x1="120" y1="0" x2="120" y2="520" stroke="#e5e5e5" stroke-width="0.5" opacity="0.3"/>

  <!-- Header -->
  <g transform="translate(120, 48)">
    <rect width="5" height="22" fill="#007AFF"/>
    <text x="0" y="0" class="section-title">JUDICIAL TRIBUNAL // SLOP COURT v3.5</text>
    <text x="860" y="10" text-anchor="end" class="mono-bold" fill="#555555">38 STATUTE PENAL CODE</text>
    <text x="860" y="26" text-anchor="end" class="mono-meta" fill="#888888">FEL-01..08 • MIS-01..06</text>
  </g>

  <!-- Header divider -->
  <line x1="120" y1="92" x2="1140" y2="92" stroke="#e5e5e5" stroke-width="0.5"/>

  <!-- JUROR CARDS -->
  <g transform="translate(120, 104)">
    <rect width="328" height="268" rx="4" fill="#ffffff" stroke="#e5e5e5" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="328" y2="0" stroke="#007AFF" stroke-width="1"/>

    <g transform="translate(18, 22)" style="animation: fadeInUp 0.6s cubic-bezier(0.25, 0.1, 0.25, 1) forwards; opacity: 0">
      <circle cx="0" cy="0" r="3" fill="#007AFF"/>
      <text x="10" y="2" class="juror-title" fill="#007AFF">JUROR 01 // STYLISTIC</text>
      <text x="0" y="22" class="juror-tag">CRAFT &amp; TONE AUDITOR</text>
      <line x1="0" y1="40" x2="280" y2="40" stroke="#e5e5e5" stroke-width="0.5"/>

      <g transform="translate(0, 52)">
        <text x="0" y="0" class="item-bullet">• AI buzzword &amp; marketing cliché purge (MIS-02)</text>
        <text x="0" y="22" class="item-bullet">• Unearned purple gradient violations (MIS-03)</text>
        <text x="0" y="44" class="item-bullet">• Tautological syntax comment purge (MIS-01)</text>
        <text x="0" y="66" class="item-bullet">• Truncated code stub arrest (FEL-01)</text>
        <text x="0" y="88" class="item-bullet">• Fabricated statistics &amp; metrics (FEL-04)</text>
      </g>

      <line x1="0" y1="156" x2="280" y2="156" stroke="#e5e5e5" stroke-width="0.5"/>
      <text x="0" y="174" class="mono-meta">BENCH: 40% • THRESHOLD: ZERO FELONIES</text>
    </g>
  </g>

  <!-- JUROR 02 -->
  <g transform="translate(352, 104)">
    <rect width="328" height="268" rx="4" fill="#ffffff" stroke="#e5e5e5" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="328" y2="0" stroke="#34C759" stroke-width="1"/>

    <g transform="translate(18, 22)" style="animation: fadeInUp 0.6s cubic-bezier(0.25, 0.1, 0.25, 1) 0.1s forwards; opacity: 0">
      <circle cx="0" cy="0" r="3" fill="#34C759"/>
      <text x="10" y="2" class="juror-title" fill="#34C759">JUROR 02 // STRUCTURAL</text>
      <text x="0" y="22" class="juror-tag">AST &amp; COMPLEXITY ARBITER</text>
      <line x1="0" y1="40" x2="280" y2="40" stroke="#e5e5e5" stroke-width="0.5"/>

      <g transform="translate(0, 52)">
        <text x="0" y="0" class="item-bullet">• Recursive AST validation</text>
        <text x="0" y="22" class="item-bullet">• Nesting depth > 5 rejection (MIS-06)</text>
        <text x="0" y="44" class="item-bullet">• Monolithic functions > 150 stmts (MIS-07)</text>
        <text x="0" y="66" class="item-bullet">• Lazy stubbed NotImplementedError (FEL-02)</text>
        <text x="0" y="88" class="item-bullet">• Strict type safety contracts</text>
      </g>

      <line x1="0" y1="156" x2="280" y2="156" stroke="#e5e5e5" stroke-width="0.5"/>
      <text x="0" y="174" class="mono-meta">BENCH: 30% • THRESHOLD: ZERO FELONIES</text>
    </g>
  </g>

  <!-- JUROR 03 -->
  <g transform="translate(682, 104)">
    <rect width="328" height="268" rx="4" fill="#ffffff" stroke="#e5e5e5" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="328" y2="0" stroke="#FF9500" stroke-width="1"/>

    <g transform="translate(18, 22)" style="animation: fadeInUp 0.6s cubic-bezier(0.25, 0.1, 0.25, 1) 0.2s forwards; opacity: 0">
      <circle cx="0" cy="0" r="3" fill="#FF9500"/>
      <text x="10" y="2" class="juror-title">JUROR 03 // INTEGRITY</text>
      <text x="0" y="22" class="juror-tag">SECURITY &amp; INVARIANTS</text>
      <line x1="0" y1="40" x2="280" y2="40" stroke="#e5e5e5" stroke-width="0.5"/>

      <g transform="translate(0, 52)">
        <text x="0" y="0" class="item-bullet">• Silent error blackhole arrest (FEL-03)</text>
        <text x="0" y="22" class="item-bullet">• Plaintext key exposure (FEL-06)</text>
        <text x="0" y="44" class="item-bullet">• Dangerous shell execution guard (FEL-07)</text>
        <text x="0" y="66" class="item-bullet">• SQL injection pattern detection (FEL-08)</text>
        <text x="0" y="88" class="item-bullet">• Subprocess exit code verification</text>
      </g>

      <line x1="0" y1="156" x2="280" y2="156" stroke="#e5e5e5" stroke-width="0.5"/>
      <text x="0" y="174" class="mono-meta">BENCH: 30% • THRESHOLD: ZERO FELONIES</text>
    </g>
  </g>

  <!-- Verdict Chambers -->
  <g transform="translate(120, 400)">
    <rect width="538" height="72" rx="4" fill="#f7f6f3" stroke="#e5e5e5" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="538" y2="0" stroke="#34C759" stroke-width="1"/>

    <g transform="translate(18, 12)" style="animation: fadeInUp 0.6s cubic-bezier(0.25, 0.1, 0.25, 1) 0.3s forwards; opacity: 0">
      <text x="10" y="2" class="verdict-title" fill="#34C759">RULING A: UNANIMOUS 3/3 ACQUITTAL (EXIT 0)</text>
      <text x="0" y="20" class="verdict-line">• Zero Capital Felonies sustained</text>
      <text x="0" y="34" class="verdict-line">• Cryptographic SHA-256 clearance generated</text>
    </g>
  </g>

  <g transform="translate(662, 400)">
    <rect width="538" height="72" rx="4" fill="#f7f6f3" stroke="#e5e5e5" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="538" y2="0" stroke="#FF9500" stroke-width="1"/>

    <g transform="translate(18, 12)" style="animation: fadeInUp 0.6s cubic-bezier(0.25, 0.1, 0.25, 1) 0.3s forwards; opacity: 0">
      <text x="10" y="2" class="verdict-title">RULING B: CONTEMPT (EXIT 1)</text>
      <text x="0" y="20" class="verdict-line">• Capital Felony breach detected</text>
      <text x="0" y="34" class="verdict-line">• Git Bailiff intercepts commit</text>
    </g>
  </g>

  <!-- Footer -->
  <line x1="120" y1="504" x2="1140" y2="504" stroke="#e5e5e5" stroke-width="0.5"/>
</svg>