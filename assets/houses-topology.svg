  <!-- 3. Header Bar -->
  <g transform="translate(48, 50)">
    <rect width="5" height="22" fill="#ff5722"/>
    <text x="14" y="16" class="head-title">WORKSHOP OS // 7 SOVEREIGN HOUSES TOPOLOGY</text>
    
    <text x="1104" y="10" text-anchor="end" class="mono-bold" fill="#ff5722">SPEC 3.5 // MODULAR RUNTIME</text>
