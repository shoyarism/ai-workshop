    .house-num { font-family: "JetBrains Mono", "SF Mono", monospace; font-size: 11px; font-weight: 800; fill: #f3f4f8; }
    .house-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 800; font-size: 12px; fill: #cbd0e0; letter-spacing: -0.2px; }
    .house-stat { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700; fill: #ff5722; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; font-size: 11px; fill: #f3f4f8; }
