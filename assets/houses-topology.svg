<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <defs>
    <!-- Deep Canvas Substrate -->
    <linearGradient id="topoGround" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070a"/>
      <stop offset="50%" stop-color="#0a0c12"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Card Inset Surface -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121520"/>
      <stop offset="100%" stop-color="#0a0b10"/>
    </linearGradient>

    <!-- Security High-Alert Card Inset -->
    <linearGradient id="secCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181113"/>
      <stop offset="100%" stop-color="#0d090b"/>
    </linearGradient>

    <!-- Structural Bevel Light -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2434"/>
      <stop offset="50%" stop-color="#353c52"/>
      <stop offset="100%" stop-color="#1f2434"/>
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#171a26"/>
    </pattern>

    <!-- Radar Sweep Beam -->
    <linearGradient id="radarBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4f17" stop-opacity="0"/>
      <stop offset="85%" stop-color="#ff4f17" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ff4f17" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <style>
    /* Typography Invariants */
    .head-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-weight: 900; font-size: 20px; letter-spacing: -0.8px; fill: #f3f5fa; }
    .mono-meta { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 9.5px; letter-spacing: 1px; fill: #8a94a6; }
    .mono-bold { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; }
    .house-num { font-family: "JetBrains Mono", "SF Mono", monospace; font-size: 10px; font-weight: 800; fill: #f3f5fa; }
    .house-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 800; font-size: 11px; fill: #cbd3e1; letter-spacing: -0.2px; }
    .house-stat { font-family: "JetBrains Mono", monospace; font-size: 9px; font-weight: 700; fill: #ff4f17; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; font-size: 10.5px; fill: #f3f5fa; }
    .item-desc { font-family: "JetBrains Mono", "SF Mono", monospace; font-size: 8.5px; fill: #727c90; }

    /* Keyframe Animations */
    @keyframes radar-sweep {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { opacity: 0.6; }
      100% { transform: translateY(492px); opacity: 0; }
    }
    @keyframes house-glow {
      0%, 100% { stroke-opacity: 0.6; filter: drop-shadow(0 0 2px rgba(255,79,23,0.3)); }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 8px rgba(255,79,23,0.8)); }
    }
    @keyframes reticle-spin-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes reticle-spin-ccw {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes house-laser-bar {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px currentColor); }
    }
    
    /* 7-Step Running Sequencer */
    @keyframes seq-1 { 0%, 100% { transform: scale(1); opacity: 0.4; } 14% { transform: scale(1.4); opacity: 1; } }
    @keyframes seq-2 { 0%, 100% { transform: scale(1); opacity: 0.4; } 28% { transform: scale(1.4); opacity: 1; } }
    @keyframes seq-3 { 0%, 100% { transform: scale(1); opacity: 0.4; } 42% { transform: scale(1.4); opacity: 1; } }
    @keyframes seq-4 { 0%, 100% { transform: scale(1); opacity: 0.4; } 56% { transform: scale(1.4); opacity: 1; } }
    @keyframes seq-5 { 0%, 100% { transform: scale(1); opacity: 0.4; } 70% { transform: scale(1.4); opacity: 1; } }
    @keyframes seq-6 { 0%, 100% { transform: scale(1); opacity: 0.4; } 84% { transform: scale(1.4); opacity: 1; } }
    @keyframes seq-7 { 0%, 100% { transform: scale(1); opacity: 0.4; } 98% { transform: scale(1.4); opacity: 1; } }

    .anim-scan { animation: radar-sweep 7s ease-in-out infinite; }
    .anim-glow { animation: house-glow 3s ease-in-out infinite; }
    .anim-spin-cw { animation: reticle-spin-cw 22s linear infinite; }
    .anim-spin-ccw { animation: reticle-spin-ccw 28s linear infinite; }
    .anim-laser { animation: house-laser-bar 2.4s ease-in-out infinite; }
    
    .anim-seq-1 { animation: seq-1 3.5s infinite; transform-origin: 2px -2px; }
    .anim-seq-2 { animation: seq-2 3.5s infinite; transform-origin: 2px -2px; }
    .anim-seq-3 { animation: seq-3 3.5s infinite; transform-origin: 2px -2px; }
    .anim-seq-4 { animation: seq-4 3.5s infinite; transform-origin: 2px -2px; }
    .anim-seq-5 { animation: seq-5 3.5s infinite; transform-origin: 2px -2px; }
    .anim-seq-6 { animation: seq-6 3.5s infinite; transform-origin: 2px -2px; }
    .anim-seq-7 { animation: seq-7 3.5s infinite; transform-origin: 2px -2px; }
  </style>

  <!-- 1. Background Ground -->
  <rect width="1200" height="540" fill="url(#topoGround)"/>
  <rect width="1200" height="540" fill="url(#dotGrid)"/>

