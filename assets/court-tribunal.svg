        <text x="0" y="22" class="item-bullet">• Control nesting depth > 5 (MIS-06)</text>
        <text x="0" y="44" class="item-bullet">• Monolithic functions > 150 stmts (MIS-07)</text>
        <text x="0" y="66" class="item-bullet">• Lazy stubbed NotImplemented (FEL-02)</text>
        <text x="0" y="88" class="item-bullet">• Strict type contracts &amp; schemas</text>
      </g>

      <line x1="0" y1="184" x2="294" y2="184" stroke="#f1f5f9" stroke-width="1"/>
      <text x="0" y="200" class="mono-meta">BENCH WEIGHT: 30% (3/3 UNANIMOUS)</text>
      <text x="0" y="214" class="mono-meta" font-weight="600" fill="#16a34a">THRESHOLD: ZERO CAPITAL FELONIES</text>
