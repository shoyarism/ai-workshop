<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="100%" height="100%">
  <defs>
    <linearGradient id="tribGround" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f12"/>
      <stop offset="50%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>

    <!-- Bevel Light -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2d3a"/>
      <stop offset="50%" stop-color="#404456"/>
      <stop offset="100%" stop-color="#2a2d3a"/>
    </linearGradient>

    <!-- Juror Module Background -->
    <linearGradient id="jurorBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161820"/>
      <stop offset="100%" stop-color="#111217"/>
    </linearGradient>

    <!-- Juror 3 Alert Background -->
    <linearGradient id="jurorAlertBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1416"/>
      <stop offset="100%" stop-color="#120e10"/>
    </linearGradient>

    <pattern id="tribGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.7" fill="#1e2029"/>
    </pattern>
  </defs>

  <style>
    .tr-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; font-weight: 900; letter-spacing: -1.5px; fill: #eceae4; text-transform: uppercase; }
    .tr-mono { font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; font-size: 10px; letter-spacing: 1.2px; fill: #8e919a; }
    .tr-mono-bold { font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; }
    .tr-col-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; font-weight: 800; font-size: 13.5px; fill: #eceae4; text-transform: uppercase; letter-spacing: -0.5px; }
    .tr-col-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 400; font-size: 11.5px; fill: #a5a8b2; line-height: 1.5; }
  </style>

  <!-- Ground Canvas -->
  <rect width="1080" height="480" fill="url(#tribGround)"/>
  <rect width="1080" height="480" fill="url(#tribGrid)"/>

  <!-- Outer Structural Chassis (Zero Radius Milled Chassis) -->
  <rect x="20" y="20" width="1040" height="440" fill="none" stroke="#252732" stroke-width="1.2"/>
  <line x1="21" y1="21" x2="1059" y2="21" stroke="url(#bevelLight)" stroke-width="1"/>
  <line x1="21" y1="459" x2="1059" y2="459" stroke="#050608" stroke-width="1.2"/>

  <!-- Precision Calibration Targets -->
  <g stroke="#eb5e28" stroke-width="1" opacity="0.85">
    <circle cx="20" cy="20" r="4" fill="none"/>
    <circle cx="1060" cy="20" r="4" fill="none"/>
    <circle cx="20" cy="460" r="4" fill="none"/>
    <circle cx="1060" cy="460" r="4" fill="none"/>
  </g>

  <!-- Header Block -->
  <g transform="translate(40, 44)">
    <rect width="6" height="26" fill="#eb5e28"/>
    <text x="16" y="20" class="tr-head" font-size="22">TRIBUNAL // SLOP COURT v3.5 SPECIFICATION</text>
    <text x="1000" y="18" text-anchor="end" class="tr-mono">GOVERNANCE: DETERMINISTIC AST INVARIANTS</text>
  </g>

  <line x1="40" y1="84" x2="1040" y2="84" stroke="#222530" stroke-width="1.2"/>
  <line x1="40" y1="85" x2="1040" y2="85" stroke="#0d0e12" stroke-width="1"/>

  <!-- 3 Asymmetric Juror Monoliths (Strict Swiss Columns) -->

  <!-- Juror 01: CRAFT & TONE (Width 310) -->
  <g transform="translate(40, 108)">
    <rect width="310" height="248" fill="url(#jurorBg)" stroke="#282a36" stroke-width="1.2"/>
    <line x1="1" y1="1" x2="309" y2="1" stroke="url(#bevelLight)" stroke-width="0.8"/>
    <rect width="310" height="4" fill="#50535e"/>
    <!-- Screws -->
    <circle cx="8" cy="14" r="2.5" fill="#1a1c24" stroke="#363948" stroke-width="0.5"/>
    <circle cx="302" cy="14" r="2.5" fill="#1a1c24" stroke="#363948" stroke-width="0.5"/>

    <g transform="translate(18, 20)">
      <text x="0" y="0" class="tr-mono-bold" fill="#8e919a">JUROR 01 // STYLISTIC</text>
      <text x="0" y="24" class="tr-col-title">CRAFT &amp; TONE</text>
      <line x1="0" y1="36" x2="274" y2="36" stroke="#222530"/>

      <g transform="translate(0, 52)">
        <text x="0" y="0" class="tr-col-desc">• Anti-slop &amp; marketing fluff purge</text>
        <text x="0" y="22" class="tr-col-desc">• Unearned purple gradient ban (MIS-03)</text>
        <text x="0" y="44" class="tr-col-desc">• Tautological comment elimination</text>
        <text x="0" y="66" class="tr-col-desc">• Lazy omission placeholders (FEL-01)</text>
      </g>

      <line x1="0" y1="138" x2="274" y2="138" stroke="#222530"/>
      <text x="0" y="158" class="tr-mono" fill="#8e919a">BENCH WEIGHT: 40%</text>
      <text x="0" y="174" class="tr-mono" fill="#50535e">THRESHOLD: ZERO CAPITAL FELONIES</text>
    </g>
  </g>

  <!-- Juror 02: ARCHITECTURE & AST (Width 310) -->
  <g transform="translate(370, 108)">
    <rect width="310" height="248" fill="url(#jurorBg)" stroke="#282a36" stroke-width="1.2"/>
    <line x1="1" y1="1" x2="309" y2="1" stroke="url(#bevelLight)" stroke-width="0.8"/>
    <rect width="310" height="4" fill="#eceae4"/>
    <!-- Screws -->
    <circle cx="8" cy="14" r="2.5" fill="#1a1c24" stroke="#363948" stroke-width="0.5"/>
    <circle cx="302" cy="14" r="2.5" fill="#1a1c24" stroke="#363948" stroke-width="0.5"/>

    <g transform="translate(18, 20)">
      <text x="0" y="0" class="tr-mono-bold" fill="#eceae4">JUROR 02 // STRUCTURAL</text>
      <text x="0" y="24" class="tr-col-title">AST &amp; ARCHITECTURE</text>
      <line x1="0" y1="36" x2="274" y2="36" stroke="#222530"/>

      <g transform="translate(0, 52)">
        <text x="0" y="0" class="tr-col-desc">• Abstract syntax tree recursive parser</text>
        <text x="0" y="22" class="tr-col-desc">• Nesting &gt; 6 levels abort (FEL-03)</text>
        <text x="0" y="44" class="tr-col-desc">• God-function &amp; complexity sprawl</text>
        <text x="0" y="66" class="tr-col-desc">• Strict modular coupling invariants</text>
      </g>

      <line x1="0" y1="138" x2="274" y2="138" stroke="#222530"/>
      <text x="0" y="158" class="tr-mono" fill="#8e919a">BENCH WEIGHT: 30%</text>
      <text x="0" y="174" class="tr-mono" fill="#50535e">THRESHOLD: ZERO CAPITAL FELONIES</text>
    </g>
  </g>

  <!-- Juror 03: SECURITY & INVARIANTS (Width 320) -->
  <g transform="translate(700, 108)">
    <rect width="320" height="248" fill="url(#jurorAlertBg)" stroke="#eb5e28" stroke-width="1.2"/>
    <line x1="1" y1="1" x2="319" y2="1" stroke="#f47342" stroke-width="0.8"/>
    <rect width="320" height="4" fill="#eb5e28"/>
    <!-- Screws -->
    <circle cx="8" cy="14" r="2.5" fill="#1a1c24" stroke="#eb5e28" stroke-width="0.5"/>
    <circle cx="312" cy="14" r="2.5" fill="#1a1c24" stroke="#eb5e28" stroke-width="0.5"/>

    <g transform="translate(18, 20)">
      <text x="0" y="0" class="tr-mono-bold" fill="#eb5e28">JUROR 03 // INTEGRITY</text>
      <text x="0" y="24" class="tr-col-title">SECURITY &amp; INVARIANTS</text>
      <line x1="0" y1="36" x2="284" y2="36" stroke="#382522"/>

      <g transform="translate(0, 52)">
        <text x="0" y="0" class="tr-col-desc">• Silent error blackhole arrest (`except: pass`)</text>
        <text x="0" y="22" class="tr-col-desc">• Plaintext token &amp; key scanner (FEL-06)</text>
        <text x="0" y="44" class="tr-col-desc">• Unlogged error swallowers blocked</text>
        <text x="0" y="66" class="tr-col-desc">• Destructive command guardrail check</text>
      </g>

      <line x1="0" y1="138" x2="284" y2="138" stroke="#382522"/>
      <text x="0" y="158" class="tr-mono" fill="#eb5e28">BENCH WEIGHT: 30%</text>
      <text x="0" y="174" class="tr-mono" fill="#8e919a">THRESHOLD: ZERO CAPITAL FELONIES</text>
    </g>
  </g>

  <!-- Bottom Judicial Decision Chamber -->
  <g transform="translate(40, 376)">
    <rect width="1000" height="66" fill="#161820" stroke="#252732" stroke-width="1.2"/>
    <line x1="1" y1="1" x2="999" y2="1" stroke="url(#bevelLight)" stroke-width="0.8"/>
    
    <!-- Path A: Acquittal Path -->
    <g transform="translate(16, 16)">
      <rect width="12" height="12" fill="#10b981"/>
      <text x="22" y="10" class="tr-mono-bold" fill="#10b981">PATH A: UNANIMOUS 3/3 ACQUITTAL</text>
      <text x="22" y="26" class="tr-mono" fill="#8e919a">&#8594; Cryptographic SHA-256 clearance token generated &#8594; Git Bailiff permits commit (Exit 0)</text>
    </g>

    <!-- Dividing Pipe -->
    <line x1="560" y1="12" x2="560" y2="54" stroke="#252732" stroke-width="1"/>

    <!-- Path B: Conviction Path -->
    <g transform="translate(580, 16)">
      <rect width="12" height="12" fill="#eb5e28"/>
      <text x="22" y="10" class="tr-mono-bold" fill="#eb5e28">PATH B: SUSTAINED CAPITAL FELONY</text>
      <text x="22" y="26" class="tr-mono" fill="#8e919a">&#8594; Judicial arrest logged to docket &#8594; Bailiff hook halts commit immediately (Exit 1)</text>
    </g>
  </g>
</svg>
