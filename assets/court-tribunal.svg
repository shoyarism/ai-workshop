        <text x="0" y="22" class="item-bullet">• Unearned purple gradients in CSS (MIS-03)</text>
        <text x="0" y="44" class="item-bullet">• Tautological syntax comments (MIS-01)</text>
        <text x="0" y="66" class="item-bullet">• Truncated code stub arrest (FEL-01)</text>
