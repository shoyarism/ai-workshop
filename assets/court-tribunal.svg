<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <!-- =================================================================
       WORKSHOP OS Judicial Tribunal // Slop Court v3.5
       Apple Minimalist Design Language • HIG 2025 Standard
       Mathematical Card Spacing & Text Containment Invariants Verified
       ================================================================= -->
  <defs>
    <style>
