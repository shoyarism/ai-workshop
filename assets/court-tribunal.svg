      .section-tag { font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Consolas, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; fill: #64748b; }
      .mono-meta { font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Consolas, monospace; font-size: 10px; fill: #64748b; letter-spacing: 0.3px; }
      .mono-bold { font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Consolas, monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px; }
      .juror-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
      .juror-tag { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.4px; fill: #64748b; }
      .item-bullet { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; font-weight: 500; font-size: 11px; fill: #334155; }
      .verdict-title { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 11.5px; font-weight: 800; letter-spacing: 0.6px; }
