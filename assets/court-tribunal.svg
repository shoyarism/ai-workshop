<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="100%" height="100%">
  <defs>
    <linearGradient id="tribGround" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111215"/>
      <stop offset="60%" stop-color="#141519"/>
      <stop offset="100%" stop-color="#0f1013"/>
    </linearGradient>

    <pattern id="tribGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.65" fill="#242630"/>
    </pattern>
  </defs>

  <style>
    .tr-head { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-weight: 900; letter-spacing: -2px; fill: #eceae4; text-transform: uppercase; }
    .tr-mono { font-family: "SF Mono", Consolas, monospace; font-size: 10px; letter-spacing: 1.2px; fill: #8e919a; }
    .tr-mono-bold { font-family: "SF Mono", Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; }
    .tr-col-title { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-weight: 800; font-size: 13.5px; fill: #eceae4; text-transform: uppercase; letter-spacing: -0.5px; }
    .tr-col-desc { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-weight: 400; font-size: 11.5px; fill: #a5a8b2; line-height: 1.45; }
  </style>

  <!-- Ground Canvas -->
  <rect width="1080" height="480" fill="url(#tribGround)"/>
  <rect width="1080" height="480" fill="url(#tribGrid)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1040" height="440" fill="none" stroke="#252730" stroke-width="1.2"/>

  <!-- Calibration Targets -->
  <g stroke="#eb5e28" stroke-width="1" opacity="0.8">
    <circle cx="20" cy="20" r="4" fill="none"/>
    <circle cx="1060" cy="20" r="4" fill="none"/>
    <circle cx="20" cy="460" r="4" fill="none"/>
    <circle cx="1060" cy="460" r="4" fill="none"/>
  </g>

  <!-- Header Block (Safely Contained with End-Anchoring) -->
  <g transform="translate(40, 44)">
    <rect width="6" height="26" fill="#eb5e28"/>
    <text x="16" y="20" class="tr-head" font-size="22">TRIBUNAL // SLOP COURT v3.5 SPECIFICATION</text>
    <text x="1000" y="18" text-anchor="end" class="tr-mono">GOVERNANCE: DETERMINISTIC AST INVARIANTS</text>
  </g>

  <line x1="40" y1="84" x2="1040" y2="84" stroke="#252730" stroke-width="1.2"/>

  <!-- 3 Asymmetric Juror Monoliths (Strict Swiss Columns, Perfectly Contained) -->

  <!-- Juror 01: CRAFT & TONE (Width 310) -->
  <g transform="translate(40, 108)">
    <rect width="310" height="250" fill="#16171d" stroke="#2a2c36" stroke-width="1.2"/>
    <rect width="310" height="4" fill="#50535e"/>

    <g transform="translate(18, 20)">
      <text x="0" y="0" class="tr-mono-bold" fill="#8e919a">JUROR 01 // STYLISTIC</text>
      <text x="0" y="24" class="tr-col-title">CRAFT &amp; TONE</text>
      <line x1="0" y1="36" x2="274" y2="36" stroke="#252732"/>

      <g transform="translate(0, 52)">
        <text x="0" y="0" class="tr-col-desc">• Anti-slop &amp; marketing fluff purge</text>
        <text x="0" y="22" class="tr-col-desc">• Unearned purple gradient ban</text>
        <text x="0" y="44" class="tr-col-desc">• Tautological comment elimination</text>
        <text x="0" y="66" class="tr-col-desc">• Lazy omission placeholders (FEL-01)</text>
      </g>

      <line x1="0" y1="140" x2="274" y2="140" stroke="#252732"/>
      <text x="0" y="160" class="tr-mono" fill="#8e919a">BENCH WEIGHT: 40%</text>
      <text x="0" y="176" class="tr-mono" fill="#50535e">THRESHOLD: ZERO CAPITAL FELONIES</text>
    </g>
  </g>

  <!-- Juror 02: ARCHITECTURE & AST (Width 310) -->
  <g transform="translate(370, 108)">
    <rect width="310" height="250" fill="#16171d" stroke="#2a2c36" stroke-width="1.2"/>
    <rect width="310" height="4" fill="#eceae4"/>

    <g transform="translate(18, 20)">
      <text x="0" y="0" class="tr-mono-bold" fill="#eceae4">JUROR 02 // STRUCTURAL</text>
      <text x="0" y="24" class="tr-col-title">AST &amp; ARCHITECTURE</text>
      <line x1="0" y1="36" x2="274" y2="36" stroke="#252732"/>

      <g transform="translate(0, 52)">
        <text x="0" y="0" class="tr-col-desc">• Abstract syntax tree parser</text>
        <text x="0" y="22" class="tr-col-desc">• Nesting &gt; 6 levels abort (FEL-03)</text>
        <text x="0" y="44" class="tr-col-desc">• God-function &amp; sprawl detector</text>
        <text x="0" y="66" class="tr-col-desc">• Modular coupling enforcement</text>
      </g>

      <line x1="0" y1="140" x2="274" y2="140" stroke="#252732"/>
      <text x="0" y="160" class="tr-mono" fill="#8e919a">BENCH WEIGHT: 30%</text>
      <text x="0" y="176" class="tr-mono" fill="#50535e">THRESHOLD: ZERO CAPITAL FELONIES</text>
    </g>
  </g>

  <!-- Juror 03: SECURITY & INVARIANTS (Width 340) -->
  <g transform="translate(700, 108)">
    <rect width="340" height="250" fill="#16171d" stroke="#eb5e28" stroke-width="1.2"/>
    <rect width="340" height="4" fill="#eb5e28"/>

    <g transform="translate(18, 20)">
      <text x="0" y="0" class="tr-mono-bold" fill="#eb5e28">JUROR 03 // INTEGRITY</text>
      <text x="0" y="24" class="tr-col-title">SECURITY &amp; INVARIANTS</text>
      <line x1="0" y1="36" x2="304" y2="36" stroke="#333644"/>

      <g transform="translate(0, 52)">
        <text x="0" y="0" class="tr-col-desc">• Silent exception arrest (FEL-02)</text>
        <text x="0" y="22" class="tr-col-desc">• Unlogged empty catch blocks</text>
        <text x="0" y="44" class="tr-col-desc">• Exposed API keys &amp; PAT tokens</text>
        <text x="0" y="66" class="tr-col-desc">• Sandbox boundary validation</text>
      </g>

      <line x1="0" y1="140" x2="304" y2="140" stroke="#333644"/>
      <text x="0" y="160" class="tr-mono-bold" fill="#eb5e28">BENCH WEIGHT: 30%</text>
      <text x="0" y="176" class="tr-mono" fill="#50535e">THRESHOLD: IMMEDIATE COMMIT BLOCK</text>
    </g>
  </g>

  <!-- Bottom Strip: The Git Bailiff Interceptor (Width 1000, Perfectly Partitioned) -->
  <g transform="translate(40, 380)">
    <rect width="1000" height="60" fill="#16171d" stroke="#2a2c36" stroke-width="1.2"/>
    <rect width="6" height="60" fill="#eb5e28"/>

    <!-- Left side: Clearance Output -->
    <text x="20" y="24" class="tr-mono-bold" fill="#eb5e28">GIT BAILIFF INTERCEPTOR // PRE-COMMIT &amp; PRE-PUSH HOOK</text>
    <text x="20" y="44" class="tr-col-desc">
      <tspan fill="#eceae4">0 SUSTAINED FELONIES:</tspan> SHA-256 docket token emitted. Pre-commit/push exits code 0.
    </text>

    <!-- Dividing line -->
    <line x1="510" y1="0" x2="510" y2="60" stroke="#252732"/>

    <!-- Right side: Abort Output (Safely Contained) -->
    <g transform="translate(530, 0)">
      <text x="0" y="24" class="tr-mono-bold" fill="#eceae4">&gt;= 1 SUSTAINED FELONY:</text>
      <text x="0" y="44" class="tr-col-desc" fill="#eb5e28">
        CONTEMPT OF COURT. Hook exits code 1. Git operation physically aborted.
      </text>
    </g>
  </g>
</svg>
