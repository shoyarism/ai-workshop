<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- =================================================================
       WORKSHOP OS Brand Colors Palette v3.5
       Redesigned: Apple Minimalist Aesthetic
       Reference: Apple HIG Color System 2025
       ================================================================= -->
  <style>
    .title { font-family: "SF Pro Display", Georgia, serif; font-weight: 800; font-size: 32px; fill: #111111; letter-spacing: -0.01em; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 14px; fill: #555555; font-weight: 400; }
    .label { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 12px; fill: #888888; letter-spacing: 0.5px; font-weight: 500; }
    .value { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 13px; fill: #111111; font-weight: 600; }
    .section-label { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 12px; fill: #888888; letter-spacing: 0.5px; text-transform: uppercase; font-weight: 600; }
    .swatch { stroke: #e5e5e5; stroke-width: 0.5; }
  </style>

  <!-- Background: Clean white canvas -->
  <rect width="800" height="600" fill="#fdfdfd"/>

  <!-- Left margin whitespace -->
  <rect x="0" y="0" width="120" height="600" fill="#fdfdfd"/>

  <!-- Vertical divider on left edge of content -->
  <line x1="120" y1="0" x2="120" y2="600" stroke="#e5e5e5" stroke-width="0.5" opacity="0.3"/>

  <!-- Title -->
  <g transform="translate(120, 48)">
    <text x="0" y="0" class="title">WORKSHOP</text>
    <text x="0" y="34" class="subtitle">Color System • Zero-Slop Verified</text>
  </g>

  <!-- Main content grid (2 columns) -->
  <g transform="translate(120, 100)">
    <!-- Column 1: Primary Colors -->
    <text x="0" y="0" class="section-label">PRIMARY SIGNAL</text>

    <!-- Black -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="120" height="80" rx="4" fill="#111111" class="swatch"/>
      <text x="130" y="20" class="value">--black: #111111</text>
      <text x="130" y="42" class="label">Deep Black</text>
    </g>

    <!-- Off-White (Canvas) -->
    <g transform="translate(0, 112)">
      <rect x="0" y="0" width="120" height="80" rx="4" fill="#fdfdfd" class="swatch"/>
      <text x="130" y="20" class="value">--white: #fdfdfd</text>
      <text x="130" y="42" class="label">Pure White</text>
    </g>

    <!-- Accent Blue (Signal) -->
    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="120" height="80" rx="4" fill="#007AFF" class="swatch"/>
      <text x="130" y="20" class="value">--accent: #007AFF</text>
      <text x="130" y="42" class="label">Signal Blue</text>
    </g>

    <!-- Column 2: Neutral Palette -->
    <text x="180" y="0" class="section-label">NEUTRALS</text>

    <!-- Gray 900 -->
    <g transform="translate(180, 24)">
      <rect x="0" y="0" width="120" height="80" rx="4" fill="#111111" class="swatch"/>
      <text x="130" y="20" class="value">--gray-900: #111111</text>
      <text x="130" y="42" class="label">Primary Text</text>
    </g>

    <!-- Gray 500 -->
    <g transform="translate(180, 112)">
      <rect x="0" y="0" width="120" height="80" rx="4" fill="#555555" class="swatch"/>
      <text x="130" y="20" class="value">--gray-500: #555555</text>
      <text x="130" y="42" class="label">Secondary Text</text>
    </g>

    <!-- Gray 300 -->
    <g transform="translate(180, 200)">
      <rect x="0" y="0" width="120" height="80" rx="4" fill="#888888" class="swatch"/>
      <text x="130" y="20" class="value">--gray-300: #888888</text>
      <text x="130" y="42" class="label">Disabled Text</text>
    </g>

    <!-- Gray 200 (Divider) -->
    <g transform="translate(180, 288)">
      <line x1="0" y1="0" x2="120" y2="0" stroke="#e5e5e5" stroke-width="0.5"/>
      <text x="130" y="0" class="value">--gray-200: #e5e5e5</text>
      <text x="130" y="18" class="label">Dividers / Borders</text>
    </g>
  </g>
</svg>