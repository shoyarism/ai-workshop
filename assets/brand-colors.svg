<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- =================================================================
       WORKSHOP OS Brand Colors Palette v3.5
       Apple Minimalist Aesthetic • HIG 2025 Color System
       Mathematical Column Spacing & Text Invariants Verified
       ================================================================= -->
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; font-weight: 800; font-size: 28px; fill: #0f172a; letter-spacing: -0.02em; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; font-size: 13px; fill: #64748b; font-weight: 400; }
      .section-label { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 11px; fill: #007AFF; letter-spacing: 0.8px; font-weight: 700; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; font-size: 11.5px; fill: #64748b; font-weight: 500; }
      .value { font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Consolas, monospace; font-size: 12.5px; fill: #0f172a; font-weight: 700; }
      .swatch { stroke: #cbd5e1; stroke-width: 0.8; }
    </style>
  </defs>

  <!-- Background Ground -->
  <rect width="800" height="600" fill="#fdfdfd"/>

  <!-- Left structural hairline -->
  <line x1="80" y1="44" x2="80" y2="540" stroke="#e2e8f0" stroke-width="0.8"/>

  <!-- ==================== TITLE ==================== -->
  <g transform="translate(80, 44)">
    <rect width="4" height="24" fill="#007AFF"/>
    <text x="14" y="20" class="title">WORKSHOP OS // COLOR SYSTEM</text>
    <text x="14" y="44" class="subtitle">Apple Minimalist Palette • Zero-Slop Verified • High-Contrast WCAG AAA</text>
  </g>

  <line x1="80" y1="104" x2="720" y2="104" stroke="#e2e8f0" stroke-width="0.8"/>

  <!-- ==================== 2-COLUMN COLOR MATRIX ==================== -->
  <!-- Column 1: Primary Signals (x=80, width=280) -->
  <g transform="translate(80, 124)">
    <text x="0" y="0" class="section-label">PRIMARY SIGNALS</text>

    <!-- Deep Carbon Black -->
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="72" height="52" rx="6" fill="#0f172a" class="swatch"/>
      <text x="86" y="22" class="value">#0F172A</text>
      <text x="86" y="40" class="label">Carbon Text // Primary</text>
    </g>

    <!-- Signal Accent Blue -->
    <g transform="translate(0, 84)">
      <rect x="0" y="0" width="72" height="52" rx="6" fill="#007AFF" class="swatch"/>
      <text x="86" y="22" class="value">#007AFF</text>
      <text x="86" y="40" class="label">Signal Blue // Accent</text>
    </g>

    <!-- Invariant Success Green -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="72" height="52" rx="6" fill="#16a34a" class="swatch"/>
      <text x="86" y="22" class="value">#16A34A</text>
      <text x="86" y="40" class="label">Court Acquittal Green</text>
    </g>

    <!-- Breach Alert Amber -->
    <g transform="translate(0, 216)">
      <rect x="0" y="0" width="72" height="52" rx="6" fill="#f59e0b" class="swatch"/>
      <text x="86" y="22" class="value">#F59E0B</text>
      <text x="86" y="40" class="label">Integrity Warning</text>
    </g>

    <!-- Capital Felony Crimson -->
    <g transform="translate(0, 282)">
      <rect x="0" y="0" width="72" height="52" rx="6" fill="#dc2626" class="swatch"/>
      <text x="86" y="22" class="value">#DC2626</text>
      <text x="86" y="40" class="label">Contempt of Court Red</text>
    </g>
  </g>

  <!-- Column 2: Neutral Palette (x=420, width=280) -->
  <g transform="translate(420, 124)">
    <text x="0" y="0" class="section-label">NEUTRAL SURFACES</text>

    <!-- Canvas Off-White -->
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="72" height="52" rx="6" fill="#fdfdfd" class="swatch"/>
      <text x="86" y="22" class="value">#FDFDFD</text>
      <text x="86" y="40" class="label">Base Canvas Substrate</text>
    </g>

    <!-- Card Pure White -->
    <g transform="translate(0, 84)">
      <rect x="0" y="0" width="72" height="52" rx="6" fill="#ffffff" class="swatch"/>
      <text x="86" y="22" class="value">#FFFFFF</text>
      <text x="86" y="40" class="label">Card Surface Elevation</text>
    </g>

    <!-- Inset Tint -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="72" height="52" rx="6" fill="#f8fafc" class="swatch"/>
      <text x="86" y="22" class="value">#F8FAFC</text>
      <text x="86" y="40" class="label">Inset Container Background</text>
    </g>

    <!-- Hairline Divider -->
    <g transform="translate(0, 216)">
      <rect x="0" y="0" width="72" height="52" rx="6" fill="#e2e8f0" class="swatch"/>
      <text x="86" y="22" class="value">#E2E8F0</text>
      <text x="86" y="40" class="label">Structural Hairline Borders</text>
    </g>

    <!-- Slate Muted Text -->
    <g transform="translate(0, 282)">
      <rect x="0" y="0" width="72" height="52" rx="6" fill="#64748b" class="swatch"/>
      <text x="86" y="22" class="value">#64748B</text>
      <text x="86" y="40" class="label">Secondary Meta Typography</text>
    </g>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <line x1="80" y1="520" x2="720" y2="520" stroke="#e2e8f0" stroke-width="0.8"/>
  <g transform="translate(80, 542)">
    <text x="0" y="0" class="label" font-weight="600">WORKSHOP OS v3.5 • CODIFIED DESIGN TOKENS • WCAG AAA ACCESSIBILITY</text>
    <text x="640" y="0" text-anchor="end" class="label" font-weight="600">ZERO UNEARNED PURPLE GRADIENTS</text>
  </g>
</svg>
