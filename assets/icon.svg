<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- =================================================================
       WORKSHOP OS App Icon v3.5
       Apple Minimalist Design Language • macOS Squircle Specification
       ================================================================= -->
  <defs>
    <linearGradient id="surfaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="topFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>

    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0051C7"/>
    </linearGradient>

    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0051C7"/>
      <stop offset="100%" stop-color="#003E99"/>
    </linearGradient>
  </defs>

  <!-- macOS / iOS Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#surfaceGrad)" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="none" stroke="#ffffff" stroke-width="1"/>

  <!-- Subtle Architectural Grid Hairlines -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#e2e8f0" stroke-width="0.8"/>
  <line x1="64" y1="12" x2="64" y2="116" stroke="#e2e8f0" stroke-width="0.6" stroke-dasharray="2 3"/>
  <line x1="12" y1="64" x2="116" y2="64" stroke="#e2e8f0" stroke-width="0.6" stroke-dasharray="2 3"/>

  <!-- Isometric Invariant Monolith -->
  <g>
    <!-- Top Facet -->
    <path d="M 64 26 L 96 44.5 L 64 63 L 32 44.5 Z" fill="url(#topFacet)"/>
    <!-- Left Facet -->
    <path d="M 32 44.5 L 64 63 L 64 100 L 32 81.5 Z" fill="url(#leftFacet)"/>
    <!-- Right Facet -->
    <path d="M 64 63 L 96 44.5 L 96 81.5 L 64 100 Z" fill="url(#rightFacet)"/>

    <!-- Inner Precision Core (White Invariant Kernel) -->
    <polygon points="64,47 78,55 78,71 64,79 50,71 50,55" fill="#ffffff" opacity="0.96"/>
    <polygon points="64,53 72,57.5 72,66.5 64,71 56,66.5 56,57.5" fill="#007AFF"/>
  </g>

  <!-- Status Verification Node (Top Right) -->
  <circle cx="100" cy="28" r="4.5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
</svg>
