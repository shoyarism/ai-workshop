<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 84" width="100%" height="100%">
  <defs>
    <!-- Dark Substrate -->
    <linearGradient id="logoCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121520"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>

    <!-- Signal Vermilion Flame -->
    <linearGradient id="logoFlameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7043"/>
      <stop offset="50%" stop-color="#ff4f17"/>
      <stop offset="100%" stop-color="#d83a00"/>
    </linearGradient>

    <!-- Cyber Cyan Invariant -->
    <linearGradient id="logoCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Card Border Trace Gradient -->
    <linearGradient id="logoBorderTrace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4f17"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#00e599"/>
    </linearGradient>
  </defs>

  <style>
    .brand-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; font-size: 26px; letter-spacing: -0.8px; fill: #f3f5fa; }
    .brand-accent { fill: #ff4f17; }
    .brand-sub { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; fill: #8a94a6; }
    .brand-tag { font-family: "JetBrains Mono", monospace; font-size: 8.5px; font-weight: 800; letter-spacing: 1px; fill: #00e599; }

    /* Keyframe Animations */
    @keyframes float-icon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2.5px); }
    }
    @keyframes core-breathe {
      0%, 100% { transform: scale(1); opacity: 0.92; filter: drop-shadow(0 0 2px rgba(6,182,212,0.4)); }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 7px rgba(56,189,248,0.9)); }
    }
    @keyframes orbit-ring {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes border-trace-flow {
      to { stroke-dashoffset: -48; }
    }
    @keyframes slash-laser {
      0%, 100% { fill: #ff4f17; filter: drop-shadow(0 0 1px #ff4f17); }
      50% { fill: #ff784e; filter: drop-shadow(0 0 5px rgba(255,79,23,0.9)); }
    }
    @keyframes sonar-wave {
      0% { r: 3px; opacity: 0.95; }
      100% { r: 7.5px; opacity: 0; }
    }
    @keyframes pill-pulse {
      0%, 100% { stroke-opacity: 0.6; }
      50% { stroke-opacity: 1; }
    }

    .anim-float { animation: float-icon 3.6s ease-in-out infinite; }
    .anim-core { animation: core-breathe 2.8s ease-in-out infinite; transform-origin: 32px 32px; }
    .anim-orbit { animation: orbit-ring 20s linear infinite; transform-origin: 32px 32px; stroke-dasharray: 4 6; }
    .anim-trace { stroke-dasharray: 8 8; animation: border-trace-flow 2.4s linear infinite; }
    .anim-slash { animation: slash-laser 2.2s ease-in-out infinite; }
    .anim-sonar { animation: sonar-wave 1.8s cubic-bezier(0.2, 0.6, 0.4, 1) infinite; }
    .anim-pill { animation: pill-pulse 2.4s ease-in-out infinite; }
  </style>

  <!-- Left Icon Lockup (64x64 at x=10, y=10) with Floating Physics -->
  <g transform="translate(10, 10)" class="anim-float">
    <rect width="64" height="64" rx="16" fill="url(#logoCardGrad)" stroke="#23293a" stroke-width="1.2"/>
    <rect width="64" height="64" rx="16" fill="none" stroke="url(#logoBorderTrace)" stroke-width="1.2" opacity="0.6" class="anim-trace"/>

    <!-- Orbital Calibration Ring -->
    <circle cx="32" cy="32" r="26" fill="none" stroke="#222838" stroke-width="0.8" class="anim-orbit"/>
    
    <!-- Anvil / Prism Geometry with Glowing Kernel -->
    <g transform="translate(32, 32) scale(0.65) translate(-64, -64)">
      <path d="M 64 26 L 94 44 L 64 62 L 34 44 Z" fill="url(#logoFlameGrad)"/>
      <path d="M 34 44 L 64 62 L 64 98 L 34 80 Z" fill="#b83200"/>
      <path d="M 64 62 L 94 44 L 94 80 L 64 98 Z" fill="#ff5a22"/>
      
      <!-- Inner Monolith Glowing Core -->
      <g class="anim-core">
        <polygon points="64,48 76,56 76,72 64,80 52,72 52,56" fill="url(#logoCyanGrad)"/>
        <polygon points="64,54 70,58 70,68 64,72 58,68 58,58" fill="#ffffff" opacity="0.9"/>
      </g>
    </g>
  </g>

  <!-- Typography Lockup -->
  <g transform="translate(90, 22)">
    <text x="0" y="24" class="brand-title">WORKSHOP <tspan class="brand-accent anim-slash">//</tspan> OS</text>
    <text x="0" y="44" class="brand-sub">THE IRREDUCIBLE OPERATING FOUNDATION</text>

    <!-- Status Pill (Fully Animated Sonar + Pulse) -->
    <g transform="translate(254, 8)">
      <rect width="90" height="18" rx="4" fill="#0d1814" stroke="#00e599" stroke-width="0.8" class="anim-pill"/>
      <circle cx="10" cy="9" r="3" fill="#00e599" opacity="0.3" class="anim-sonar"/>
      <circle cx="10" cy="9" r="3" fill="#00e599"/>
      <text x="18" y="12.5" class="brand-tag">v3.5 ARMED</text>
    </g>
  </g>
</svg>