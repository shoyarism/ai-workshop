<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 84" width="100%" height="100%">
  <!-- =================================================================
       WORKSHOP OS Logo v3.5
       Apple Minimalist Aesthetic • HIG 2025 Standard
       Mathematical Text Containment & Alignment Invariants Verified
       ================================================================= -->
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0051C7"/>
    </linearGradient>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.02em;
      fill: #111111;
    }
    .brand-slash {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-weight: 700;
      font-size: 22px;
      fill: url(#accent);
    }
    .brand-tag {
      font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Consolas, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.3px;
      fill: #666666;
    }
    .pill-text {
      font-family: "SF Mono", "Geist Mono", "JetBrains Mono", Consolas, monospace;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.8px;
      fill: #15803d;
    }
  </style>

  <!-- Clean Canvas -->
  <rect width="520" height="84" fill="#fdfdfd"/>

  <!-- Left structural hairline -->
  <line x1="0" y1="12" x2="0" y2="72" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Typography Group (Vertically Centered) -->
  <g transform="translate(24, 0)">
    <text x="0" y="37" class="brand-title">
      WORKSHOP <tspan class="brand-slash">//</tspan> OS
    </text>
    <text x="0" y="59" class="brand-tag">v3.5 • 0.0% SLOP INDEX • 2,267+ SKILLS</text>
  </g>

  <!-- Status Pill Badge (Math-bounded: x=396, width=100, ends at 496, 24px padding to 520) -->
  <g transform="translate(396, 28)">
    <rect width="100" height="28" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.75"/>
    <circle cx="14" cy="14" r="3.5" fill="#16a34a"/>
    <text x="25" y="18" class="pill-text">VERIFIED</text>
  </g>
</svg>
