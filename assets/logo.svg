<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 84" width="100%" height="100%">
  <!-- =================================================================
       WORKSHOP OS Logo v3.5
       Redesigned: Apple Minimalist Aesthetic
       Reference: Apple Human Interface Guidelines 2025
       ================================================================= -->
  <defs>
    <!-- Single accent color only - used for key interactive elements -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0062FF"/>
    </linearGradient>
  </defs>

  <style>
    /* Apple Typography Stack */
    /* SF Pro Display / SF Pro Text hierarchy */
    .brand-title {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.02em;
      fill: #111111;
      line-height: 1.2;
    }
    .brand-accent {
      font-family: "SF Pro Display", -apple-system, system-ui, sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.02em;
      fill: url(#accent);
    }
    .brand-tag {
      font-family: "SF Mono", "Geist Mono", Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      fill: #888888;
    }
    .brand-sub {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0;
      fill: #555555;
      line-height: 1.4;
    }
  </style>

  <!-- White canvas background -->
  <rect width="500" height="84" fill="#fdfdfd"/>

  <!-- Left structural rail -->
  <line x1="0" y1="0" x2="0" y2="84" stroke="#e5e5e5" stroke-width="0.5"/>

  <!-- Typography -->
  <g transform="translate(16, 22)">
    <text x="0" y="0" class="brand-title">
      WORKSHOP <tspan class="brand-accent">//</tspan> OS
    </text>
    <text x="0" y="28" class="brand-tag">v3.5 • 0.0% SLOP INDEX</text>
  </g>

  <!-- Right status indicator -->
  <g transform="translate(340, 14)">
    <rect width="66" height="20" rx="10" fill="#e5e5e5"/>
    <circle cx="10" cy="10" r="4" fill="#346538"/>
    <text x="18" y="13" class="brand-tag">VERIFIED</text>
  </g>
</svg>