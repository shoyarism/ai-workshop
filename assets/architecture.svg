<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="100%" height="100%">
  <defs>
    <linearGradient id="rackGround" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f12"/>
      <stop offset="50%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>

    <!-- Bevel Light -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2d3a"/>
      <stop offset="50%" stop-color="#404456"/>
      <stop offset="100%" stop-color="#2a2d3a"/>
    </linearGradient>

    <!-- Compartment Module Background -->
    <linearGradient id="compBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161820"/>
      <stop offset="100%" stop-color="#111217"/>
    </linearGradient>

    <!-- Court Highlight Background -->
    <linearGradient id="courtBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1618"/>
      <stop offset="100%" stop-color="#120e10"/>
    </linearGradient>

    <!-- Dot Grid for Architectural Texture -->
    <pattern id="archGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.7" fill="#1e2029"/>
    </pattern>
  </defs>

  <style>
    .rack-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; font-weight: 900; letter-spacing: -1.5px; fill: #eceae4; text-transform: uppercase; }
    .rack-mono { font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; font-size: 10px; letter-spacing: 1.2px; fill: #8e919a; }
    .rack-mono-bold { font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; }
    .port-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; font-weight: 800; font-size: 13.5px; fill: #eceae4; text-transform: uppercase; letter-spacing: -0.5px; }
    .port-item { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; font-weight: 700; font-size: 11.5px; fill: #ffffff; }
    .port-sub { font-family: "SF Mono", "JetBrains Mono", monospace; font-size: 9px; fill: #727580; }
  </style>

  <!-- Base Ground -->
  <rect width="1160" height="520" fill="url(#rackGround)"/>
  <rect width="1160" height="520" fill="url(#archGrid)"/>

  <!-- Outer Structural Chassis (Zero Radius Milled Chassis) -->
  <rect x="20" y="20" width="1120" height="480" fill="none" stroke="#252732" stroke-width="1.2"/>
  <line x1="21" y1="21" x2="1139" y2="21" stroke="url(#bevelLight)" stroke-width="1"/>
  <line x1="21" y1="499" x2="1139" y2="499" stroke="#050608" stroke-width="1.2"/>

  <!-- Precision Calibration Targets -->
  <g stroke="#eb5e28" stroke-width="1" opacity="0.85">
    <circle cx="20" cy="20" r="4" fill="none"/>
    <circle cx="1140" cy="20" r="4" fill="none"/>
    <circle cx="20" cy="500" r="4" fill="none"/>
    <circle cx="1140" cy="500" r="4" fill="none"/>
  </g>

  <!-- Top Title Strip -->
  <g transform="translate(40, 44)">
    <rect width="6" height="26" fill="#eb5e28"/>
    <text x="16" y="20" class="rack-head" font-size="22">SYSTEM TOPOLOGY // ARCHITECTURAL BLUEPRINT</text>
    <text x="1070" y="18" text-anchor="end" class="rack-mono">SPEC: DETERMINISTIC AST INVARIANTS</text>
  </g>

  <line x1="40" y1="84" x2="1110" y2="84" stroke="#222530" stroke-width="1.2"/>
  <line x1="40" y1="85" x2="1110" y2="85" stroke="#0d0e12" stroke-width="1"/>

  <!-- 4 Compartment Industrial Modular Rack -->

  <!-- COMPARTMENT 01: HARNESSES (Width 240) -->
  <g transform="translate(40, 108)">
    <rect width="240" height="344" fill="url(#compBg)" stroke="#282a36" stroke-width="1.2"/>
    <line x1="1" y1="1" x2="239" y2="1" stroke="url(#bevelLight)" stroke-width="0.8"/>
    <rect width="240" height="4" fill="#50535e"/>
    <!-- Mount Screws -->
    <circle cx="8" cy="14" r="2.5" fill="#1a1c24" stroke="#363948" stroke-width="0.5"/>
    <circle cx="232" cy="14" r="2.5" fill="#1a1c24" stroke="#363948" stroke-width="0.5"/>

    <g transform="translate(16, 20)">
      <text x="0" y="0" class="rack-mono" fill="#8e919a">PORT 01 // CLIENTS</text>
      <text x="0" y="24" class="port-title">AGENT HARNESSES</text>
      <line x1="0" y1="36" x2="208" y2="36" stroke="#222530"/>

      <!-- Harness Items -->
      <g transform="translate(0, 48)">
        <text x="0" y="0" class="port-item">CLAUDE CODE</text>
        <text x="0" y="13" class="port-sub">CLAUDE.md + FastMCP tools</text>

        <text x="0" y="38" class="port-item">CURSOR &amp; WINDSURF</text>
        <text x="0" y="51" class="port-sub">.cursorrules + context</text>

        <text x="0" y="76" class="port-item">GEMINI ANTIGRAVITY</text>
        <text x="0" y="89" class="port-sub">SOUL.md Master Soul Hook</text>

        <text x="0" y="114" class="port-item">OPENCODE &amp; KILO</text>
        <text x="0" y="127" class="port-sub">opencode.json &amp; kilo.jsonc</text>

        <text x="0" y="152" class="port-item">CLI &amp; DOCKER RUNTIME</text>
        <text x="0" y="165" class="port-sub">`workshop` CLI + Sandbox</text>
      </g>

      <line x1="0" y1="230" x2="208" y2="230" stroke="#222530"/>
      <text x="0" y="250" class="rack-mono" fill="#50535e">ZERO VENDOR LOCK-IN</text>
    </g>
  </g>

  <!-- High-Density Signal Conduit 1 -->
  <line x1="280" y1="270" x2="310" y2="270" stroke="#eb5e28" stroke-width="2"/>
  <circle cx="280" cy="270" r="3" fill="#eb5e28"/>
  <circle cx="310" cy="270" r="3" fill="#eb5e28"/>
  <rect x="291" y="266" width="8" height="8" fill="#eb5e28"/>

  <!-- COMPARTMENT 02: THE COURT (Width 260) -->
  <g transform="translate(310, 108)">
    <rect width="260" height="344" fill="url(#courtBg)" stroke="#eb5e28" stroke-width="1.5"/>
    <line x1="1" y1="1" x2="259" y2="1" stroke="#f47342" stroke-width="0.8"/>
    <rect width="260" height="4" fill="#eb5e28"/>
    <!-- Mount Screws -->
    <circle cx="8" cy="14" r="2.5" fill="#1a1c24" stroke="#eb5e28" stroke-width="0.5"/>
    <circle cx="252" cy="14" r="2.5" fill="#1a1c24" stroke="#eb5e28" stroke-width="0.5"/>

    <g transform="translate(16, 20)">
      <text x="0" y="0" class="rack-mono-bold" fill="#eb5e28">PORT 02 // GATEKEEPER</text>
      <text x="0" y="24" class="port-title">SLOP COURT v3.5</text>
      <line x1="0" y1="36" x2="228" y2="36" stroke="#382522"/>

      <!-- 3-Juror Matrix -->
      <g transform="translate(0, 52)">
        <text x="0" y="0" class="port-item">01. JUROR CRAFT</text>
        <text x="0" y="14" class="port-sub">Anti-slop &amp; tone audit (40%)</text>

        <text x="0" y="38" class="port-item">02. JUROR AST</text>
        <text x="0" y="52" class="port-sub">Complexity &amp; Nesting &gt; 6 (30%)</text>

        <text x="0" y="76" class="port-item">03. JUROR INVARIANTS</text>
        <text x="0" y="90" class="port-sub">Silent `except: pass` arrest (30%)</text>

        <text x="0" y="116" class="port-item" fill="#eb5e28">GIT BAILIFF HOOKS</text>
        <text x="0" y="130" class="port-sub">Pre-commit / push gatekeeper</text>
      </g>

      <line x1="0" y1="210" x2="228" y2="210" stroke="#382522"/>
      <text x="0" y="230" class="rack-mono" fill="#eb5e28">SHA-256 ACQUITTAL TOKEN</text>
      <text x="0" y="246" class="rack-mono" fill="#8e919a">FAILURES ABORT WITH EXIT 1</text>
    </g>
  </g>

  <!-- High-Density Signal Conduit 2 -->
  <line x1="570" y1="270" x2="600" y2="270" stroke="#eb5e28" stroke-width="2"/>
  <circle cx="570" cy="270" r="3" fill="#eb5e28"/>
  <circle cx="600" cy="270" r="3" fill="#eb5e28"/>
  <rect x="581" y="266" width="8" height="8" fill="#eb5e28"/>

  <!-- COMPARTMENT 03: THE COUNCIL (Width 250) -->
  <g transform="translate(600, 108)">
    <rect width="250" height="344" fill="url(#compBg)" stroke="#282a36" stroke-width="1.2"/>
    <line x1="1" y1="1" x2="249" y2="1" stroke="url(#bevelLight)" stroke-width="0.8"/>
    <rect width="250" height="4" fill="#38bdf8"/>
    <!-- Mount Screws -->
    <circle cx="8" cy="14" r="2.5" fill="#1a1c24" stroke="#363948" stroke-width="0.5"/>
    <circle cx="242" cy="14" r="2.5" fill="#1a1c24" stroke="#363948" stroke-width="0.5"/>

    <g transform="translate(16, 20)">
      <text x="0" y="0" class="rack-mono" fill="#38bdf8">PORT 03 // DELIBERATION</text>
      <text x="0" y="24" class="port-title">SUPREME COUNCIL</text>
      <line x1="0" y1="36" x2="218" y2="36" stroke="#222530"/>

      <!-- 4 Personas -->
      <g transform="translate(0, 52)">
        <text x="0" y="0" class="port-item">THE INQUISITOR</text>
        <text x="0" y="14" class="port-sub">Red-teams tail failure modes</text>

        <text x="0" y="38" class="port-item">THE MINIMALIST</text>
        <text x="0" y="52" class="port-sub">YAGNI &amp; Bloat pruner</text>

        <text x="0" y="76" class="port-item">THE CRAFT ARCHITECT</text>
        <text x="0" y="90" class="port-sub">Typography &amp; UI token rigor</text>

        <text x="0" y="114" class="port-item">BATTLE-TESTED SRE</text>
        <text x="0" y="128" class="port-sub">Backpressure &amp; crash invariants</text>
      </g>

      <line x1="0" y1="210" x2="218" y2="210" stroke="#222530"/>
      <text x="0" y="230" class="rack-mono" fill="#38bdf8">ADVERSARIAL DIALECTIC</text>
      <text x="0" y="246" class="rack-mono" fill="#50535e">BREAKS SINGLE-MODEL ECHO</text>
    </g>
  </g>

  <!-- High-Density Signal Conduit 3 -->
  <line x1="850" y1="270" x2="880" y2="270" stroke="#eb5e28" stroke-width="2"/>
  <circle cx="850" cy="270" r="3" fill="#eb5e28"/>
  <circle cx="880" cy="270" r="3" fill="#eb5e28"/>
  <rect x="861" y="266" width="8" height="8" fill="#eb5e28"/>

  <!-- COMPARTMENT 04: THE FOUNDRY (Width 230) -->
  <g transform="translate(880, 108)">
    <rect width="230" height="344" fill="url(#compBg)" stroke="#282a36" stroke-width="1.2"/>
    <line x1="1" y1="1" x2="229" y2="1" stroke="url(#bevelLight)" stroke-width="0.8"/>
    <rect width="230" height="4" fill="#10b981"/>
    <!-- Mount Screws -->
    <circle cx="8" cy="14" r="2.5" fill="#1a1c24" stroke="#363948" stroke-width="0.5"/>
    <circle cx="222" cy="14" r="2.5" fill="#1a1c24" stroke="#363948" stroke-width="0.5"/>

    <g transform="translate(16, 20)">
      <text x="0" y="0" class="rack-mono" fill="#10b981">PORT 04 // STORAGE</text>
      <text x="0" y="24" class="port-title">THE FOUNDRY</text>
      <line x1="0" y1="36" x2="198" y2="36" stroke="#222530"/>

      <!-- Foundry Elements -->
      <g transform="translate(0, 52)">
        <text x="0" y="0" class="port-item">2,150+ SKILL RUNBOOKS</text>
        <text x="0" y="14" class="port-sub">7 Sovereign Houses</text>

        <text x="0" y="38" class="port-item">OBSIDIAN 2ND BRAIN</text>
        <text x="0" y="52" class="port-sub">ADRs &amp; Post-Mortems</text>

        <text x="0" y="76" class="port-item">FASTMCP PROTOCOL</text>
        <text x="0" y="90" class="port-sub">Universal Tool Gateway</text>

        <text x="0" y="114" class="port-item">ZERO-CLONE PROTOCOL</text>
        <text x="0" y="128" class="port-sub">Raw curl cloud stream</text>
      </g>

      <line x1="0" y1="210" x2="198" y2="210" stroke="#222530"/>
      <text x="0" y="230" class="rack-mono" fill="#10b981">EXECUTION ARSENAL</text>
      <text x="0" y="246" class="rack-mono" fill="#50535e">EPISODIC PERSISTENCE</text>
    </g>
  </g>

  <!-- Bottom Global Data Bus -->
  <line x1="40" y1="472" x2="1110" y2="472" stroke="#222530" stroke-width="1.2"/>
  <g transform="translate(40, 488)">
    <text x="0" y="0" class="rack-mono" fill="#606474">BUS ARCHITECTURE: PARALLEL AST CONCURRENCY • SHA-256 CRYPTOGRAPHIC SIGNATURES • ZERO DATA LOSS</text>
  </g>
</svg>
