<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="100%" height="100%">
  <defs>
    <linearGradient id="rackGround" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111215"/>
      <stop offset="60%" stop-color="#141519"/>
      <stop offset="100%" stop-color="#0f1013"/>
    </linearGradient>

    <!-- Dot Grid for Architectural Texture -->
    <pattern id="archGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.65" fill="#242630"/>
    </pattern>
  </defs>

  <style>
    .rack-head { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-weight: 900; letter-spacing: -2px; fill: #eceae4; text-transform: uppercase; }
    .rack-mono { font-family: "SF Mono", Consolas, monospace; font-size: 10px; letter-spacing: 1.2px; fill: #8e919a; }
    .rack-mono-bold { font-family: "SF Mono", Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; }
    .port-title { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-weight: 800; font-size: 13.5px; fill: #eceae4; text-transform: uppercase; letter-spacing: -0.5px; }
    .port-item { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-weight: 700; font-size: 12px; fill: #ffffff; }
    .port-sub { font-family: "SF Mono", monospace; font-size: 9px; fill: #727580; }
  </style>

  <!-- Base Ground -->
  <rect width="1160" height="520" fill="url(#rackGround)"/>
  <rect width="1160" height="520" fill="url(#archGrid)"/>

  <!-- Outer Structural Chassis (Zero Radius) -->
  <rect x="20" y="20" width="1120" height="480" fill="none" stroke="#252730" stroke-width="1.2"/>

  <!-- Precision Calibration Targets -->
  <g stroke="#eb5e28" stroke-width="1" opacity="0.8">
    <circle cx="20" cy="20" r="4" fill="none"/>
    <circle cx="1140" cy="20" r="4" fill="none"/>
    <circle cx="20" cy="500" r="4" fill="none"/>
    <circle cx="1140" cy="500" r="4" fill="none"/>
  </g>

  <!-- Top Title Strip (Safely Contained with End-Anchoring) -->
  <g transform="translate(40, 44)">
    <rect width="6" height="26" fill="#eb5e28"/>
    <text x="16" y="20" class="rack-head" font-size="22">SYSTEM TOPOLOGY // ARCHITECTURAL BLUEPRINT</text>
    <text x="1070" y="18" text-anchor="end" class="rack-mono">SPEC: DETERMINISTIC AST INVARIANTS</text>
  </g>

  <line x1="40" y1="84" x2="1110" y2="84" stroke="#252730" stroke-width="1.2"/>

  <!-- 4 Compartment Industrial Modular Rack -->

  <!-- COMPARTMENT 01: INGESTION (Width 240) -->
  <g transform="translate(40, 108)">
    <rect width="240" height="340" fill="#16171d" stroke="#2a2c36" stroke-width="1.2"/>
    <rect width="240" height="4" fill="#50535e"/>

    <g transform="translate(16, 20)">
      <text x="0" y="0" class="rack-mono" fill="#8e919a">PORT 01 // CLIENTS</text>
      <text x="0" y="24" class="port-title">AGENT HARNESSES</text>
      <line x1="0" y1="36" x2="208" y2="36" stroke="#252732"/>

      <!-- Harness Items -->
      <g transform="translate(0, 52)">
        <text x="0" y="0" class="port-item">CLAUDE CODE</text>
        <text x="0" y="14" class="port-sub">CLAUDE.md + FastMCP tools</text>

        <text x="0" y="44" class="port-item">CURSOR &amp; WINDSURF</text>
        <text x="0" y="58" class="port-sub">.cursorrules + context</text>

        <text x="0" y="88" class="port-item">GEMINI ANTIGRAVITY</text>
        <text x="0" y="102" class="port-sub">SOUL.md Master Soul Hook</text>

        <text x="0" y="132" class="port-item">HUMAN OPERATOR</text>
        <text x="0" y="146" class="port-sub">Local CLI via `workshop.py`</text>
      </g>

      <line x1="0" y1="230" x2="208" y2="230" stroke="#252732"/>
      <text x="0" y="250" class="rack-mono" fill="#50535e">ZERO VENDOR LOCK-IN</text>
    </g>
  </g>

  <!-- Bus Conductor 1: Signal Conduit -->
  <line x1="280" y1="270" x2="310" y2="270" stroke="#eb5e28" stroke-width="2"/>
  <rect x="291" y="266" width="8" height="8" fill="#eb5e28"/>

  <!-- COMPARTMENT 02: THE COURT (Width 260) -->
  <g transform="translate(310, 108)">
    <rect width="260" height="340" fill="#191a22" stroke="#eb5e28" stroke-width="1.5"/>
    <rect width="260" height="4" fill="#eb5e28"/>

    <g transform="translate(16, 20)">
      <text x="0" y="0" class="rack-mono-bold" fill="#eb5e28">PORT 02 // GATEKEEPER</text>
      <text x="0" y="24" class="port-title">SLOP COURT v3.5</text>
      <line x1="0" y1="36" x2="228" y2="36" stroke="#333644"/>

      <!-- 3-Juror Matrix -->
      <g transform="translate(0, 52)">
        <text x="0" y="0" class="port-item">01. JUROR CRAFT</text>
        <text x="0" y="14" class="port-sub">Anti-slop &amp; tone audit</text>

        <text x="0" y="44" class="port-item">02. JUROR ARCH</text>
        <text x="0" y="58" class="port-sub">Nesting &gt; 6 levels abort</text>

        <text x="0" y="88" class="port-item">03. JUROR SECURITY</text>
        <text x="0" y="102" class="port-sub">Naked except/catch arrest</text>
      </g>

      <!-- Industrial Bailiff Box -->
      <g transform="translate(0, 186)">
        <rect width="228" height="48" fill="#121318" stroke="#eb5e28" stroke-width="1"/>
        <text x="10" y="20" class="rack-mono-bold" fill="#eb5e28">GIT BAILIFF HOOK:</text>
        <text x="10" y="36" class="port-sub" fill="#eceae4">Aborts commit on felonies</text>
      </g>

      <text x="0" y="260" class="rack-mono-bold" fill="#eb5e28">SHA-256 TOKEN STAMPED</text>
    </g>
  </g>

  <!-- Bus Conductor 2 -->
  <line x1="570" y1="270" x2="600" y2="270" stroke="#50535e" stroke-width="2"/>
  <rect x="581" y="266" width="8" height="8" fill="#eceae4"/>

  <!-- COMPARTMENT 03: THE SUPREME COUNCIL (Width 240) -->
  <g transform="translate(600, 108)">
    <rect width="240" height="340" fill="#16171d" stroke="#2a2c36" stroke-width="1.2"/>
    <rect width="240" height="4" fill="#eceae4"/>

    <g transform="translate(16, 20)">
      <text x="0" y="0" class="rack-mono" fill="#eceae4">PORT 03 // DIALECTICS</text>
      <text x="0" y="24" class="port-title">SUPREME COUNCIL</text>
      <line x1="0" y1="36" x2="208" y2="36" stroke="#252732"/>

      <!-- 4 Personas -->
      <g transform="translate(0, 52)">
        <text x="0" y="0" class="port-item">SKEPTICAL INQUISITOR</text>
        <text x="0" y="14" class="port-sub">Attacks edge cases</text>

        <text x="0" y="44" class="port-item">RADICAL MINIMALIST</text>
        <text x="0" y="58" class="port-sub">Enforces strict YAGNI</text>

        <text x="0" y="88" class="port-item">UI/UX ARCHITECT</text>
        <text x="0" y="102" class="port-sub">Typographic rhythm</text>

        <text x="0" y="132" class="port-item">BATTLE-TESTED SRE</text>
        <text x="0" y="146" class="port-sub">Zero-trust resilience</text>
      </g>

      <line x1="0" y1="230" x2="208" y2="230" stroke="#252732"/>
      <text x="0" y="250" class="rack-mono" fill="#50535e">ZERO SYCOPHANCY ECHO</text>
    </g>
  </g>

  <!-- Bus Conductor 3 -->
  <line x1="840" y1="270" x2="870" y2="270" stroke="#50535e" stroke-width="2"/>
  <rect x="851" y="266" width="8" height="8" fill="#50535e"/>

  <!-- COMPARTMENT 04: CORE FOUNDRY (Width 240) -->
  <g transform="translate(870, 108)">
    <rect width="240" height="340" fill="#16171d" stroke="#2a2c36" stroke-width="1.2"/>
    <rect width="240" height="4" fill="#50535e"/>

    <g transform="translate(16, 20)">
      <text x="0" y="0" class="rack-mono" fill="#8e919a">PORT 04 // FOUNDRY</text>
      <text x="0" y="24" class="port-title">SKILLS &amp; MEMORY</text>
      <line x1="0" y1="36" x2="208" y2="36" stroke="#252732"/>

      <!-- Foundry Elements -->
      <g transform="translate(0, 52)">
        <text x="0" y="0" class="port-item">2,150+ DOMAIN SKILLS</text>
        <text x="0" y="14" class="port-sub">Executable runbooks</text>

        <text x="0" y="44" class="port-item">OBSIDIAN 2ND BRAIN</text>
        <text x="0" y="58" class="port-sub">ADRs &amp; Post-Mortems</text>

        <text x="0" y="88" class="port-item">ZERO-CLONE STREAM</text>
        <text x="0" y="102" class="port-sub">Raw GitHub curl stream</text>

        <text x="0" y="132" class="port-item">FASTMCP GATEWAY</text>
        <text x="0" y="146" class="port-sub">Standard tool bindings</text>
      </g>

      <line x1="0" y1="230" x2="208" y2="230" stroke="#252732"/>
      <text x="0" y="250" class="rack-mono" fill="#50535e">APACHE 2.0 PROTOCOL</text>
    </g>
  </g>

  <!-- Bottom Data Footer Rail -->
  <line x1="40" y1="466" x2="1110" y2="466" stroke="#252730" stroke-width="1.2"/>
  <g transform="translate(40, 484)">
    <text x="0" y="0" class="rack-mono" fill="#8e919a">BUS: RECON -> PLAN -> CRAFT -> AUDIT -> VERIFY -> SKILL</text>
    <text x="1070" y="0" text-anchor="end" class="rack-mono-bold" fill="#eb5e28">SLOP INDEX: 0.0% VERIFIED</text>
  </g>
</svg>
