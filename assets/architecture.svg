    .mono-meta { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 10px; letter-spacing: 1.2px; fill: #8c92a4; }
    .mono-bold { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1.4px; }
    .port-num { font-family: "JetBrains Mono", "SF Mono", monospace; font-size: 10px; font-weight: 800; letter-spacing: 1px; }
    .port-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 800; font-size: 14px; fill: #f3f4f8; letter-spacing: -0.3px; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; font-size: 11.5px; fill: #f3f4f8; }
    .item-desc { font-family: "JetBrains Mono", "SF Mono", monospace; font-size: 9px; fill: #72798e; }
