<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <defs>
    <!-- Base Canvas Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="60%" stop-color="#0d0e12"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>

    <!-- Compartment Surface Gradient -->
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141620"/>
      <stop offset="100%" stop-color="#0f1016"/>
    </linearGradient>

    <!-- Slop Court Highlight Gradient -->
    <linearGradient id="courtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1618"/>
      <stop offset="100%" stop-color="#110d10"/>
    </linearGradient>

    <!-- Bevel Light Highlight -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#232736"/>
      <stop offset="50%" stop-color="#383e54"/>
      <stop offset="100%" stop-color="#232736"/>
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
