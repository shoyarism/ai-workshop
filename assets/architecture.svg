<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <!-- =================================================================
       WORKSHOP OS Architecture Diagram v3.5
       Apple Minimalist Design Language
       Reference: Apple Human Interface Guidelines 2025
       ================================================================= -->
  <style>
    .section-title { font-family: "SF Pro Display", Georgia, serif; font-weight: 800; font-size: 20px; fill: #111111; letter-spacing: -0.01em; }
    .section-tag { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; fill: #555555; }
    .mono-meta { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 10px; fill: #888888; letter-spacing: 0.5px; }
    .mono-bold { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; }
    .juror-title { font-family: "SF Pro Display", Georgia, serif; font-weight: 800; font-size: 14px; fill: #111111; letter-spacing: -0.01em; }
    .juror-tag { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; fill: #555555; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-weight: 700; font-size: 11px; fill: #111111; }
    .item-desc { font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 10px; fill: #555555; }
    .divider { stroke: #e5e5e5; stroke-width: 0.5; }
  </style>

  <!-- Background: Clean white -->
  <rect width="1200" height="540" fill="#fdfdfd"/>

  <!-- Vertical divider on left -->
  <line x1="120" y1="0" x2="120" y2="540" stroke="#e5e5e5" stroke-width="0.5" opacity="0.3"/>

  <!-- Title -->
  <g transform="translate(120, 48)">
    <text x="0" y="0" class="section-title">SYSTEM ARCHITECTURE // INVARIANT PIPELINE</text>
    <text x="0" y="26" class="section-tag">SPEC 3.5</text>
  </g>

  <!-- Header divider -->
  <line x1="120" y1="86" x2="1140" y2="86" stroke="#e5e5e5" stroke-width="0.5"/>

  <!-- Stage 01: INGESTION -->
  <g transform="translate(120, 100)">
    <rect width="252" height="320" rx="4" fill="#ffffff" stroke="#e5e5e5" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="252" y2="0" stroke="#007AFF" stroke-width="1"/>

    <g transform="translate(18, 24)">
      <text x="0" y="0" class="juror-title" fill="#007AFF">STAGE 01 // INGESTION</text>
      <text x="0" y="22" class="juror-tag">Agent Harnesses</text>
      <line x1="0" y1="40" x2="216" y2="40" stroke="#e5e5e5" stroke-width="0.5"/>

      <g transform="translate(0, 52)">
        <text x="0" y="0" class="item-title">Claude Code &amp; Codex</text>
        <text x="0" y="18" class="item-desc">CLAUDE.md + FastMCP tools</text>

        <text x="0" y="40" class="item-title">Cursor &amp; Windsurf</text>
        <text x="0" y="58" class="item-desc">Cascading context from .cursorrules</text>

        <text x="0" y="80" class="item-title">Gemini Antigravity</text>
        <text x="0" y="98" class="item-desc">Master Soul Hook + AGENTS.md</text>

        <text x="0" y="120" class="item-title">OpenCode &amp; Kilo</text>
        <text x="0" y="138" class="item-desc">opencode.json + kilo.jsonc</text>

        <text x="0" y="160" class="item-title">CLI &amp; Docker Sandbox</text>
        <text x="0" y="178" class="item-desc">Native console entrypoint</text>
      </g>

      <line x1="0" y1="226" x2="216" y2="226" stroke="#e5e5e5" stroke-width="0.5"/>
      <text x="0" y="244" class="mono-meta">INPUT: TASK DIRECTIVE // MULTI-AGENT AGNOSTIC</text>
    </g>
  </g>

  <!-- Conduit 1 -->
  <g transform="translate(300, 200)">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#007AFF" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#007AFF"/>
    <circle cx="28" cy="0" r="4" fill="#007AFF"/>
  </g>

  <!-- Stage 02: SLOP COURT -->
  <g transform="translate(332, 100)">
    <rect width="252" height="320" rx="4" fill="#ffffff" stroke="#e5e5e5" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="252" y2="0" stroke="#34C759" stroke-width="1"/>

    <g transform="translate(18, 24)">
      <text x="0" y="0" class="juror-title" fill="#34C759">STAGE 02 // GATEKEEPER</text>
      <text x="0" y="22" class="juror-tag">Slop Court v3.5</text>
      <line x1="0" y1="40" x2="216" y2="40" stroke="#e5e5e5" stroke-width="0.5"/>

      <g transform="translate(0, 52)">
        <text x="0" y="0" class="item-title">Juror 01: Craft &amp; Tone</text>
        <text x="0" y="18" class="item-desc">40% — Bullshit purge (MIS-02)</text>

        <text x="0" y="40" class="item-title">Juror 02: Architecture</text>
        <text x="0" y="58" class="item-desc">30% — Nesting depth > 5 (MIS-06)</text>

        <text x="0" y="80" class="item-title">Juror 03: Invariants</text>
        <text x="0" y="98" class="item-desc">30% — Silent error arrest (FEL-03)</text>

        <text x="0" y="120" class="item-title">Git Bailiff Interceptor</text>
        <text x="0" y="138" class="item-desc">Pre-commit/push gatekeeper (FEL-01/02)</text>
      </div>

      <line x1="0" y1="166" x2="216" y2="166" stroke="#e5e5e5" stroke-width="0.5"/>
      <text x="0" y="184" class="mono-meta">SHA-256 TOKEN • EXIT 0 COMMIT CLEARANCE</text>
    </g>
  </g>

  <!-- Conduit 2 -->
  <g transform="translate(584, 200)">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#007AFF" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#007AFF"/>
    <circle cx="28" cy="0" r="4" fill="#007AFF"/>
  </g>

  <!-- Stage 03: THE COUNCIL -->
  <g transform="translate(616, 100)">
    <rect width="252" height="320" rx="4" fill="#ffffff" stroke="#e5e5e5" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="252" y2="0" stroke="#007AFF" stroke-width="1"/>

    <g transform="translate(18, 24)">
      <text x="0" y="0" class="juror-title">STAGE 03 // DELIBERATION</text>
      <text x="0" y="22" class="juror-tag">Supreme Council</text>
      <line x1="0" y1="40" x2="216" y2="40" stroke="#e5e5e5" stroke-width="0.5"/>

      <g transform="translate(0, 52)">
        <text x="0" y="0" class="item-title">The Inquisitor</text>
        <text x="0" y="18" class="item-desc">Red-teams failure mode tails</text>

        <text x="0" y="40" class="item-title">The Minimalist</text>
        <text x="0" y="58" class="item-desc">YAGNI &amp; anti-bloat pruner</text>

        <text x="0" y="80" class="item-title">Craft Architect</text>
        <text x="0" y="98" class="item-desc">UI typography &amp; token rigor</text>

        <text x="0" y="120" class="item-title">Battle-Tested SRE</text>
        <text x="0" y="138" class="item-desc">Backpressure &amp; crash proofing</text>

        <text x="0" y="160" class="item-title">Adversarial Consensus</text>
        <text x="0" y="178" class="item-desc">Exposes blindspots upfront</text>
      </g>

      <line x1="0" y1="226" x2="216" y2="226" stroke="#e5e5e5" stroke-width="0.5"/>
      <text x="0" y="244" class="mono-meta">ADVERSARIAL DIALECTIC // BREAKS SINGLE-MODEL ECHO</text>
    </g>
  </g>

  <!-- Conduit 3 -->
  <g transform="translate(868, 200)">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#007AFF" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#007AFF"/>
    <circle cx="28" cy="0" r="4" fill="#007AFF"/>
  </g>

  <!-- Stage 04: THE FOUNDRY -->
  <g transform="translate(900, 100)">
    <rect width="252" height="320" rx="4" fill="#ffffff" stroke="#e5e5e5" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="252" y2="0" stroke="#007AFF" stroke-width="1"/>

    <g transform="translate(18, 24)">
      <text x="0" y="0" class="juror-title">STAGE 04 // PERSISTENCE</text>
      <text x="0" y="22" class="juror-tag">The Foundry</text>
      <line x1="0" y1="40" x2="216" y2="40" stroke="#e5e5e5" stroke-width="0.5"/>

      <g transform="translate(0, 52)">
        <text x="0" y="0" class="item-title">2,267+ Verified Skills</text>
        <text x="0" y="18" class="item-desc">7 Sovereign Houses</text>

        <text x="0" y="40" class="item-title">Obsidian 2nd Brain</text>
        <text x="0" y="58" class="item-desc">ADRs &amp; immutable post-mortems</text>

        <text x="0" y="80" class="item-title">FastMCP Protocol</text>
        <text x="0" y="98" class="item-desc">Universal tool gateway</text>

        <text x="0" y="120" class="item-title">Zero-Clone Cloud</text>
        <text x="0" y="138" class="item-desc">Raw GitHub curl stream</text>

        <text x="0" y="160" class="item-title">Cryptographic Hash</text>
        <text x="0" y="178" class="item-desc">manifest.sha256 verified</text>
      </g>

      <line x1="0" y1="226" x2="216" y2="226" stroke="#e5e5e5" stroke-width="0.5"/>
      <text x="0" y="244" class="mono-meta">EXECUTION FOUNDRY // GROUNDED MEMORY STORE</text>
    </g>
  </g>

  <!-- Global Bus Line -->
  <line x1="120" y1="492" x2="1140" y2="492" stroke="#e5e5e5" stroke-width="0.5"/>
  <line x1="120" y1="492" x2="1140" y2="492" stroke="#007AFF" stroke-width="1" opacity="0.4"/>
  <g transform="translate(120, 510)">
    <circle cx="4" cy="4" r="3" fill="#007AFF"/>
    <text x="16" y="7.5" class="mono-meta">DATA INVARIANT BUS: PARALLEL AST CONCURRENCY</text>
  </g>
</svg>