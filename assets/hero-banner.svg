<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Matte Anodized Dark Graphite Ground -->
    <linearGradient id="ground" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f12"/>
      <stop offset="50%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>

    <!-- Signal Vermilion Functional Accent -->
    <linearGradient id="vermilion" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eb5e28"/>
      <stop offset="100%" stop-color="#f26a36"/>
    </linearGradient>

    <!-- Milled Bevel Highlight Gradient -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#363948"/>
      <stop offset="50%" stop-color="#4a4f63"/>
      <stop offset="100%" stop-color="#363948"/>
    </linearGradient>

    <!-- Card Background with Micro Inset Gradient -->
    <linearGradient id="chassisBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161820"/>
      <stop offset="100%" stop-color="#101116"/>
    </linearGradient>

    <!-- Modular Dot Matrix Grid -->
    <pattern id="modularGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#20222b"/>
    </pattern>

    <!-- Vertical Rhythm Ruler -->
    <pattern id="rulerLines" width="96" height="480" patternUnits="userSpaceOnUse">
      <line x1="96" y1="0" x2="96" y2="480" stroke="#161820" stroke-width="0.8"/>
    </pattern>
  </defs>

  <style>
    .te-display { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Arial Black", sans-serif; font-weight: 900; letter-spacing: -2.5px; fill: #eceae4; text-transform: uppercase; }
    .te-mono { font-family: "SF Mono", "JetBrains Mono", Consolas, Menlo, monospace; font-size: 10px; letter-spacing: 1.2px; fill: #8e919a; }
    .te-mono-bold { font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; }
    .te-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 400; font-size: 14.5px; fill: #b8bac2; line-height: 1.55; }
    .te-label { font-family: "SF Mono", "JetBrains Mono", monospace; font-size: 9px; letter-spacing: 1.2px; fill: #656770; text-transform: uppercase; }
  </style>

  <!-- 1. The Substrate Canvas -->
  <rect width="1200" height="480" fill="url(#ground)"/>
  <rect width="1200" height="480" fill="url(#rulerLines)"/>
  <rect width="1200" height="480" fill="url(#modularGrid)"/>

  <!-- 2. Dual-Edge Milled Structural Chassis -->
  <rect x="24" y="24" width="1152" height="432" fill="none" stroke="#252732" stroke-width="1.2"/>
  <!-- Top Edge Bevel Illumination -->
  <line x1="25" y1="25" x2="1175" y2="25" stroke="url(#bevelLight)" stroke-width="1"/>
  <!-- Bottom Shadow Line -->
  <line x1="25" y1="455" x2="1175" y2="455" stroke="#050608" stroke-width="1.2"/>

  <!-- 3. Chamfered Corner Bracket Register Marks (Industrial Framing) -->
  <g stroke="#3b3f52" stroke-width="1.5" fill="none">
    <!-- Top-Left -->
    <path d="M 20 34 L 20 20 L 34 20"/>
    <!-- Top-Right -->
    <path d="M 1166 20 L 1180 20 L 1180 34"/>
    <!-- Bottom-Left -->
    <path d="M 20 446 L 20 460 L 34 460"/>
    <!-- Bottom-Right -->
    <path d="M 1166 460 L 1180 460 L 1180 446"/>
  </g>

  <!-- Optical Precision Crosshairs -->
  <g stroke="#eb5e28" stroke-width="1" opacity="0.9">
    <circle cx="24" cy="24" r="5" fill="none"/>
    <line x1="16" y1="24" x2="32" y2="24"/>
    <line x1="24" y1="16" x2="24" y2="32"/>

    <circle cx="1176" cy="24" r="5" fill="none"/>
    <line x1="1168" y1="24" x2="1184" y2="24"/>
    <line x1="1176" y1="16" x2="1176" y2="32"/>

    <circle cx="24" cy="456" r="5" fill="none"/>
    <line x1="16" y1="456" x2="32" y2="456"/>
    <line x1="24" y1="448" x2="24" y2="464"/>

    <circle cx="1176" cy="456" r="5" fill="none"/>
    <line x1="1168" y1="456" x2="1184" y2="456"/>
    <line x1="1176" y1="448" x2="1176" y2="464"/>
  </g>

  <!-- 4. Top Technical Header Bar -->
  <g transform="translate(48, 48)">
    <rect width="8" height="24" fill="url(#vermilion)"/>
    <text x="18" y="16.5" class="te-mono-bold" fill="#eceae4">SYS.ID // WORKSHOP.OS v3.5</text>

    <text x="280" y="16.5" class="te-mono">FORMAT: AUTONOMOUS RUNTIME</text>
    <text x="560" y="16.5" class="te-mono">MODULES: 2,150+ SKILLS</text>
    
    <!-- Active Status Beacon -->
    <circle cx="952" cy="13.5" r="7" fill="#10b981" opacity="0.2"/>
    <circle cx="952" cy="13.5" r="3.5" fill="#10b981"/>
    <text x="968" y="16.5" class="te-mono-bold" fill="#10b981">ZERO-SLOP ARMED</text>
    <text x="1104" y="16.5" text-anchor="end" class="te-mono" fill="#8e919a">SHA: 10f670eb</text>
  </g>

  <!-- Structural Dividing Rail -->
  <line x1="48" y1="84" x2="1152" y2="84" stroke="#252732" stroke-width="1.2"/>
  <line x1="48" y1="85" x2="1152" y2="85" stroke="#101116" stroke-width="1"/>

  <!-- 5. Main Typographic Body -->
  <g transform="translate(48, 126)">
    <text x="0" y="0" class="te-label">SECTION 01 / SPECIFICATION</text>
    <line x1="160" y1="-3" x2="230" y2="-3" stroke="#eb5e28" stroke-width="1.2"/>

    <!-- Monumental Brutalist Title -->
    <text x="0" y="74" class="te-display" font-size="80">WORKSHOP</text>
    <text x="0" y="150" class="te-display" font-size="80" fill="#4b4e5c">OS<tspan fill="#eb5e28">.</tspan></text>

    <!-- Core Value Statement -->
    <text x="0" y="202" class="te-body">The irreducible operating foundation for AI coding agents.</text>
    <text x="0" y="228" class="te-body" fill="#8e919a">Deterministic AST gates, council dialectics &amp; persistent memory.</text>
    
    <!-- Micro Spec Strip -->
    <g transform="translate(0, 252)">
      <rect width="112" height="20" fill="#181a22" stroke="#2c2f3d" stroke-width="0.8"/>
      <text x="8" y="13.5" class="te-label" fill="#eb5e28">7 HOUSES</text>
      
      <rect x="120" y="0" width="132" height="20" fill="#181a22" stroke="#2c2f3d" stroke-width="0.8"/>
      <text x="128" y="13.5" class="te-label" fill="#eceae4">3-JUROR BENCH</text>
      
      <rect x="260" y="0" width="132" height="20" fill="#181a22" stroke="#2c2f3d" stroke-width="0.8"/>
      <text x="268" y="13.5" class="te-label" fill="#10b981">EXIT 0 COMMIT</text>
    </g>
  </g>

  <!-- 6. Right Side: Modular Milled Instrument Chassis -->
  <g transform="translate(590, 106)">
    <!-- Container Box with Bevel Lighting -->
    <rect width="562" height="300" fill="url(#chassisBg)" stroke="#282a36" stroke-width="1.2"/>
    <line x1="1" y1="1" x2="561" y2="1" stroke="url(#bevelLight)" stroke-width="1"/>
    <line x1="1" y1="299" x2="561" y2="299" stroke="#08090b" stroke-width="1"/>

    <!-- Rack Screws (Eurorack Hardware Look) -->
    <g fill="#1a1c24" stroke="#363948" stroke-width="0.8">
      <circle cx="14" cy="14" r="4.5"/>
      <line x1="11" y1="14" x2="17" y2="14" stroke="#505466"/>
      
      <circle cx="548" cy="14" r="4.5"/>
      <line x1="545" y1="14" x2="551" y2="14" stroke="#505466"/>
      
      <circle cx="14" cy="286" r="4.5"/>
      <line x1="11" y1="286" x2="17" y2="286" stroke="#505466"/>
      
      <circle cx="548" cy="286" r="4.5"/>
      <line x1="545" y1="286" x2="551" y2="286" stroke="#505466"/>
    </g>

    <g transform="translate(24, 24)">
      <!-- 3 Chamfered Modular Bays -->
      
      <!-- Bay 1: Court -->
      <g transform="translate(0, 0)">
        <rect width="162" height="58" fill="url(#vermilion)"/>
        <line x1="0" y1="1" x2="162" y2="1" stroke="#ff8b59" stroke-width="1"/>
        <text x="14" y="26" class="te-mono-bold" fill="#ffffff" font-size="12">01 // COURT</text>
        <text x="14" y="44" class="te-mono" fill="#ffffff" font-size="9" opacity="0.95">AST BAILIFF GATE</text>
      </g>

      <!-- Bay 2: Council -->
      <g transform="translate(176, 0)">
        <polygon points="0,0 162,0 162,58 14,58 0,44" fill="#1b1d26" stroke="#333748" stroke-width="1"/>
        <line x1="1" y1="1" x2="161" y2="1" stroke="#484d63" stroke-width="0.8"/>
        <text x="14" y="26" class="te-mono-bold" fill="#eceae4" font-size="12">02 // COUNCIL</text>
        <text x="14" y="44" class="te-mono" fill="#8e919a" font-size="9">4-WAY DIALECTIC</text>
      </g>

      <!-- Bay 3: Foundry -->
      <g transform="translate(352, 0)">
        <rect width="162" height="58" fill="#eceae4"/>
        <line x1="0" y1="1" x2="162" y2="1" stroke="#ffffff" stroke-width="1"/>
        <text x="14" y="26" class="te-mono-bold" fill="#111215" font-size="12">03 // FOUNDRY</text>
        <text x="14" y="44" class="te-mono" fill="#50535e" font-size="9">2,150+ RUNBOOKS</text>
      </g>

      <!-- Readout Telemetry Table -->
      <g transform="translate(0, 84)">
        <!-- Row 1 -->
        <text x="0" y="16" class="te-mono" fill="#eceae4">TRIBUNAL BENCH</text>
        <text x="514" y="16" text-anchor="end" class="te-mono">3 JURORS UNANIMOUS (AST)</text>
        <line x1="0" y1="26" x2="514" y2="26" stroke="#222530" stroke-dasharray="2 4"/>

        <!-- Row 2 -->
        <text x="0" y="46" class="te-mono" fill="#eceae4">GIT INTERCEPTOR</text>
        <text x="514" y="46" text-anchor="end" class="te-mono-bold" fill="#eb5e28">BAILIFF PRE-COMMIT ARMED</text>
        <line x1="0" y1="56" x2="514" y2="56" stroke="#222530" stroke-dasharray="2 4"/>

        <!-- Row 3 -->
        <text x="0" y="76" class="te-mono" fill="#eceae4">EPISODIC MEMORY</text>
        <text x="514" y="76" text-anchor="end" class="te-mono">OBSIDIAN 2ND BRAIN // 7 NOTES</text>
        <line x1="0" y1="86" x2="514" y2="86" stroke="#222530" stroke-dasharray="2 4"/>

        <!-- Row 4 -->
        <text x="0" y="106" class="te-mono" fill="#eceae4">SLOP TOLERANCE</text>
        <text x="514" y="106" text-anchor="end" class="te-mono-bold" fill="#10b981">0.0% (ABSOLUTE ZERO)</text>
      </g>
    </g>

    <!-- Bottom Chassis Metadata Strip -->
    <rect x="0" y="270" width="562" height="30" fill="#0d0e12"/>
    <line x1="0" y1="270" x2="562" y2="270" stroke="#1f212b" stroke-width="1"/>
    <text x="16" y="289" class="te-label" fill="#757988">DOCKET: CR-20261028-FADA • CRYPTOGRAPHIC CLEARANCE TOKEN VERIFIED</text>
  </g>

  <!-- 7. Bottom Horizontal Rail & System Footer -->
  <line x1="48" y1="424" x2="1152" y2="424" stroke="#252732" stroke-width="1.2"/>
  <line x1="48" y1="425" x2="1152" y2="425" stroke="#101116" stroke-width="1"/>

  <g transform="translate(48, 444)">
    <circle cx="4" cy="3" r="3" fill="#eb5e28"/>
    <text x="18" y="7" class="te-mono-bold" fill="#eceae4">APACHE 2.0 OPEN SOURCE</text>

    <text x="360" y="7" class="te-mono">MULTI-HARNESS: CLAUDE • CURSOR • GEMINI • WINDSURF • OPENCODE • KILO</text>
    <text x="1104" y="7" text-anchor="end" class="te-mono">AUTHOR: @SHOYARISM &amp; SWARM</text>
  </g>
</svg>
