    <!-- Main Title -->
    <text x="0" y="56" class="display-title" font-size="56">WORKSHOP OS</text>

    <!-- Value Proposition -->
    <text x="0" y="96" class="body-lead">The irreducible operating foundation for AI coding agents.</text>
    <text x="0" y="122" class="body-muted">Converts stochastic model drift into deterministic code invariants</text>
    <text x="0" y="142" class="body-muted">through AST code arrest, adversarial councils, and episodic memory.</text>

