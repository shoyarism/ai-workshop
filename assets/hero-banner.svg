<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Master Dark Palette: Neutral Obsidian Canvas -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="60%" stop-color="#0d0e12"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>

    <!-- Signal Orange (Vermilion Accent) -->
    <linearGradient id="signalAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#f4511e"/>
    </linearGradient>

    <!-- Structural Bevel Light -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#232736"/>
      <stop offset="50%" stop-color="#383e54"/>
      <stop offset="100%" stop-color="#232736"/>
    </linearGradient>

    <!-- Chassis Inset Background -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14161f"/>
      <stop offset="100%" stop-color="#0f1017"/>
    </linearGradient>

    <!-- Dot Matrix Grid -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#1b1d28"/>
    </pattern>

    <!-- Vertical Rhythm Cadence Lines -->
    <pattern id="cadenceRuler" width="120" height="480" patternUnits="userSpaceOnUse">
      <line x1="120" y1="0" x2="120" y2="480" stroke="#12141c" stroke-width="0.8"/>
    </pattern>
  </defs>

  <style>
    .display-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; letter-spacing: -2px; fill: #f3f4f8; }
    .mono-meta { font-family: "JetBrains Mono", "SF Mono", Consolas, Menlo, monospace; font-size: 10px; letter-spacing: 1.2px; fill: #8c92a4; }
    .mono-bold { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1.4px; }
    .body-lead { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 500; font-size: 15px; fill: #cbd0e0; line-height: 1.5; }
    .body-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 400; font-size: 13.5px; fill: #82889c; }
    .badge-label { font-family: "JetBrains Mono", "SF Mono", monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; }
  </style>

  <!-- 1. Canvas Ground -->
  <rect width="1200" height="480" fill="url(#groundGrad)"/>
  <rect width="1200" height="480" fill="url(#cadenceRuler)"/>
  <rect width="1200" height="480" fill="url(#dotGrid)"/>

  <!-- 2. Precision Perimeter Chassis Frame -->
  <rect x="24" y="24" width="1152" height="432" fill="none" stroke="#212432" stroke-width="1.2"/>
  <line x1="25" y1="25" x2="1175" y2="25" stroke="url(#bevelLight)" stroke-width="1"/>
  <line x1="25" y1="455" x2="1175" y2="455" stroke="#050608" stroke-width="1.2"/>

  <!-- Technical Corner Marks -->
  <g stroke="#32374a" stroke-width="1.5" fill="none">
    <path d="M 20 36 L 20 20 L 36 20"/>
    <path d="M 1164 20 L 1180 20 L 1180 36"/>
    <path d="M 20 444 L 20 460 L 36 460"/>
    <path d="M 1164 460 L 1180 460 L 1180 444"/>
  </g>

  <!-- Optical Registration Targets -->
  <g stroke="#ff5722" stroke-width="1" opacity="0.8">
    <circle cx="24" cy="24" r="4.5" fill="none"/>
    <line x1="17" y1="24" x2="31" y2="24"/>
    <line x1="24" y1="17" x2="24" y2="31"/>

    <circle cx="1176" cy="24" r="4.5" fill="none"/>
    <line x1="1169" y1="24" x2="1183" y2="24"/>
    <line x1="1176" y1="17" x2="1176" y2="31"/>

    <circle cx="24" cy="456" r="4.5" fill="none"/>
    <line x1="17" y1="456" x2="31" y2="456"/>
    <line x1="24" y1="449" x2="24" y2="463"/>

    <circle cx="1176" cy="456" r="4.5" fill="none"/>
    <line x1="1169" y1="456" x2="1183" y2="456"/>
    <line x1="1176" y1="449" x2="1176" y2="463"/>
  </g>

  <!-- 3. Header Telemetry Bar -->
  <g transform="translate(48, 48)">
    <rect width="6" height="22" fill="#ff5722"/>
    <text x="16" y="15.5" class="mono-bold" fill="#f3f4f8">SYS.ID // WORKSHOP.OS v3.5</text>
    <text x="248" y="15.5" class="mono-meta">ARCH: SOVEREIGN HOUSES</text>
    <text x="448" y="15.5" class="mono-meta">RUNBOOKS: 2,150+ PRODUCTION SKILLS</text>

    <!-- Status Indicator Beacon -->
    <circle cx="896" cy="13" r="6" fill="#10b981" opacity="0.2"/>
    <circle cx="896" cy="13" r="3" fill="#10b981"/>
    <text x="910" y="15.5" class="mono-bold" fill="#10b981">ZERO-SLOP ARMED</text>

    <!-- Hash Tag -->
    <text x="1104" y="15.5" text-anchor="end" class="mono-meta" fill="#6c7387">BUILD: 380EE6FD</text>
  </g>

  <line x1="48" y1="82" x2="1152" y2="82" stroke="#1d202c" stroke-width="1"/>
  <line x1="48" y1="83" x2="1152" y2="83" stroke="#0a0b10" stroke-width="1"/>

  <!-- 4. Left Hero Block (Width: 490px) -->
  <g transform="translate(48, 120)">
