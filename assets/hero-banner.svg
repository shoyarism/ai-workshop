        <line x1="0" y1="0" x2="136" y2="0" stroke="#32374e" stroke-width="0.8"/>
        <text x="12" y="19.5" class="badge-label" fill="#ff5722">7 HOUSES</text>
        <text x="74" y="19.5" class="mono-meta" fill="#8c92a4">GUILDS</text>
