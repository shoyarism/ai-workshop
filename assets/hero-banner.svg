<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Canvas Gradient -->
    <linearGradient id="heroGround" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070a"/>
      <stop offset="50%" stop-color="#0a0c12"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Signal Vermilion Accent -->
    <linearGradient id="sigVermilion" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7043"/>
      <stop offset="50%" stop-color="#ff4f17"/>
      <stop offset="100%" stop-color="#d83a00"/>
    </linearGradient>

    <!-- Emerald Clearance Gradient -->
    <linearGradient id="sigEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#00e599"/>
    </linearGradient>

    <!-- Cyber Cyan Accent -->
    <linearGradient id="sigCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="coreGlow" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4f17" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Chassis Inset Gradient -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121520"/>
      <stop offset="100%" stop-color="#0a0b10"/>
    </linearGradient>

    <!-- Structural Bevel Highlight -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2434"/>
      <stop offset="50%" stop-color="#353c52"/>
      <stop offset="100%" stop-color="#1f2434"/>
    </linearGradient>

    <!-- Dot Matrix Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#171a26"/>
    </pattern>

    <!-- Subtle Radar Scan Beam -->
    <linearGradient id="radarBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4f17" stop-opacity="0"/>
      <stop offset="85%" stop-color="#ff4f17" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ff4f17" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <style>
    /* Typography Invariants */
    .title-display { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-weight: 900; letter-spacing: -1.5px; fill: #f3f5fa; }
    .title-accent { fill: #ff4f17; }
    .mono-meta { font-family: "JetBrains Mono", "SF Mono", Consolas, Menlo, monospace; font-size: 10px; letter-spacing: 1.1px; fill: #8a94a6; }
    .mono-bold { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; }
    .body-lead { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 500; font-size: 14.5px; fill: #cbd3e1; line-height: 1.4; }
    .body-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 400; font-size: 13px; fill: #788296; }
    .badge-label { font-family: "JetBrains Mono", monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; }

    /* Keyframe Animations */
    @keyframes radar-sweep {
      0% { transform: translateY(0); opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { transform: translateY(432px); opacity: 0; }
    }
    @keyframes beacon-ping {
      0% { r: 3px; opacity: 0.95; }
      50% { r: 7.5px; opacity: 0.25; }
      100% { r: 3px; opacity: 0.95; }
    }
    @keyframes blink-cursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes signal-dash {
      to { stroke-dashoffset: -24; }
    }
    @keyframes pulse-tab-pip {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .anim-scan { animation: radar-sweep 6.5s ease-in-out infinite; }
    .anim-pulse { animation: beacon-ping 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .anim-cursor { animation: blink-cursor 1s infinite steps(1); }
    .anim-signal { stroke-dasharray: 4 4; animation: signal-dash 1.4s linear infinite; }
    .anim-tab-pip { animation: pulse-tab-pip 2.5s ease-in-out infinite; }
  </style>

  <!-- 1. Background Ground & Ambient Lighting -->
  <rect width="1200" height="480" fill="url(#heroGround)"/>
  <rect width="1200" height="480" fill="url(#coreGlow)"/>
  <rect width="1200" height="480" fill="url(#dotGrid)"/>

  <!-- Scanning Radar Beam Overlay -->
  <g clip-path="url(#chassisClip)">
    <rect x="24" y="24" width="1152" height="48" fill="url(#radarBeam)" class="anim-scan"/>
  </g>
  <clipPath id="chassisClip">
    <rect x="24" y="24" width="1152" height="432"/>
  </clipPath>

  <!-- 2. Outer Technical Chassis Frame -->
  <rect x="24" y="24" width="1152" height="432" fill="none" stroke="#1d212c" stroke-width="1.2"/>
  <line x1="25" y1="25" x2="1175" y2="25" stroke="url(#bevelLight)" stroke-width="1"/>
  <line x1="25" y1="455" x2="1175" y2="455" stroke="#040507" stroke-width="1.2"/>

  <!-- Corner Alignment Nodes -->
  <g stroke="#2b3142" stroke-width="1.5" fill="none">
    <path d="M 20 36 L 20 20 L 36 20"/>
    <path d="M 1164 20 L 1180 20 L 1180 36"/>
    <path d="M 20 444 L 20 460 L 36 460"/>
    <path d="M 1164 460 L 1180 460 L 1180 444"/>
  </g>

  <!-- Optical Calibration Reticles -->
  <g stroke="#ff4f17" stroke-width="1" opacity="0.8">
    <circle cx="24" cy="24" r="4.5" fill="none"/>
    <line x1="17" y1="24" x2="31" y2="24"/>
    <line x1="24" y1="17" x2="24" y2="31"/>

    <circle cx="1176" cy="24" r="4.5" fill="none"/>
    <line x1="1169" y1="24" x2="1183" y2="24"/>
    <line x1="1176" y1="17" x2="1176" y2="31"/>

    <circle cx="24" cy="456" r="4.5" fill="none"/>
    <line x1="17" y1="456" x2="31" y2="456"/>
    <line x1="24" y1="449" x2="24" y2="463"/>

    <circle cx="1176" cy="456" r="4.5" fill="none"/>
    <line x1="1169" y1="456" x2="1183" y2="456"/>
    <line x1="1176" y1="449" x2="1176" y2="463"/>
  </g>

  <!-- 3. Top Telemetry Rail (Safely Spaced) -->
  <g transform="translate(48, 48)">
    <rect width="5" height="20" fill="url(#sigVermilion)"/>
    <text x="14" y="14.5" class="mono-bold" fill="#f3f5fa">WORKSHOP.OS // v3.5</text>
    <text x="210" y="14.5" class="mono-meta">ARCH: 7 SOVEREIGN HOUSES</text>
    <text x="430" y="14.5" class="mono-meta">CATALOG: 2,150+ RUNBOOKS</text>

    <!-- Animated Status Beacon -->
    <g transform="translate(730, 11)">
      <circle cx="0" cy="0" r="7" fill="#00e599" opacity="0.25" class="anim-pulse"/>
      <circle cx="0" cy="0" r="3" fill="#00e599"/>
      <text x="12" y="3.5" class="mono-bold" fill="#00e599">ZERO-SLOP ARMED</text>
    </g>

    <!-- Build SHA Tag -->
    <text x="1104" y="14.5" text-anchor="end" class="mono-meta" fill="#6a7285">BUILD: C85A0C37 • SHA-256</text>
  </g>

  <line x1="48" y1="78" x2="1152" y2="78" stroke="#181c28" stroke-width="1"/>
  <line x1="48" y1="79" x2="1152" y2="79" stroke="#050608" stroke-width="1"/>

  <!-- 4. Left Hero Sector (Width: 500px, x: 48) -->
  <g transform="translate(48, 108)">
    <!-- Small Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="152" height="20" rx="3" fill="#1c1313" stroke="#ff4f17" stroke-width="0.8"/>
      <circle cx="10" cy="10" r="2.5" fill="#ff4f17"/>
      <text x="20" y="13.5" class="mono-bold" fill="#ff4f17">ENGINEERING RUNTIME</text>
    </g>

    <!-- Hero Title -->
    <g transform="translate(0, 56)">
      <text x="0" y="0" class="title-display" font-size="54">WORKSHOP <tspan class="title-accent">//</tspan> OS</text>
    </g>

    <!-- Value Proposition -->
    <text x="0" y="92" class="body-lead">The irreducible operating foundation for AI coding agents.</text>
    <text x="0" y="118" class="body-muted">Converts stochastic model drift into deterministic code invariants</text>
    <text x="0" y="138" class="body-muted">through recursive AST arrest, adversarial councils, and episodic memory.</text>

    <!-- Key Spec Badges / Tabs (Non-colliding text-anchor layout) -->
    <g transform="translate(0, 172)">
      <!-- Badge 1: 7 Houses -->
      <g transform="translate(0, 0)">
        <rect width="144" height="30" rx="4" fill="#11131c" stroke="#222738" stroke-width="1"/>
        <line x1="0" y1="0" x2="144" y2="0" stroke="#ff4f17" stroke-width="2"/>
        <text x="12" y="19" class="badge-label" fill="#ff4f17">7 HOUSES</text>
        <text x="132" y="19" text-anchor="end" class="mono-meta" fill="#8a94a6">GUILDS</text>
      </g>

      <!-- Badge 2: AST Bailiff -->
      <g transform="translate(156, 0)">
        <rect width="160" height="30" rx="4" fill="#11131c" stroke="#222738" stroke-width="1"/>
        <line x1="0" y1="0" x2="160" y2="0" stroke="#06b6d4" stroke-width="2"/>
        <text x="12" y="19" class="badge-label" fill="#f3f5fa">AST BAILIFF</text>
        <text x="148" y="19" text-anchor="end" class="mono-meta" fill="#8a94a6">GATE</text>
      </g>

      <!-- Badge 3: 0.0% Slop -->
      <g transform="translate(328, 0)">
        <rect width="164" height="30" rx="4" fill="#11131c" stroke="#222738" stroke-width="1"/>
        <line x1="0" y1="0" x2="164" y2="0" stroke="#00e599" stroke-width="2"/>
        <text x="12" y="19" class="badge-label" fill="#00e599">0.0% SLOP</text>
        <text x="152" y="19" text-anchor="end" class="mono-meta" fill="#8a94a6">VERIFIED</text>
      </g>
    </g>

    <!-- Interactive Terminal Command Console -->
    <g transform="translate(0, 226)">
      <rect width="492" height="42" rx="4" fill="#090a10" stroke="#1c202c" stroke-width="1"/>
      <circle cx="14" cy="14" r="3" fill="#ff5f56"/>
      <circle cx="24" cy="14" r="3" fill="#ffbd2e"/>
      <circle cx="34" cy="14" r="3" fill="#27c93f"/>
      <text x="48" y="17" class="mono-meta" fill="#525a70">INVARIANT WATCHDOG</text>

      <text x="14" y="32" class="mono-bold" fill="#ff4f17">$</text>
      <text x="28" y="32" class="mono-bold" fill="#cbd3e1">workshop doctor --strict</text>
      <rect x="216" y="24" width="7" height="11" fill="#ff4f17" class="anim-cursor"/>
      <text x="478" y="32" text-anchor="end" class="mono-bold" fill="#00e599">[PASS: EXIT 0]</text>
    </g>
  </g>

  <!-- 5. Right Instrument Bay Chassis (Width: 556px, x: 596) -->
  <g transform="translate(596, 96)">
    <!-- Chassis Plate -->
    <rect width="556" height="326" rx="6" fill="url(#chassisGrad)" stroke="#202434" stroke-width="1.2"/>
    <line x1="2" y1="2" x2="554" y2="2" stroke="url(#bevelLight)" stroke-width="1"/>
    <line x1="2" y1="324" x2="554" y2="324" stroke="#040507" stroke-width="1"/>

    <!-- Eurorack Corner Screws -->
    <g fill="#12141e" stroke="#282d3e" stroke-width="0.8">
      <circle cx="14" cy="14" r="3.5"/>
      <line x1="11" y1="14" x2="17" y2="14" stroke="#404760"/>
      <circle cx="542" cy="14" r="3.5"/>
      <line x1="539" y1="14" x2="545" y2="14" stroke="#404760"/>
      <circle cx="14" cy="312" r="3.5"/>
      <line x1="11" y1="312" x2="17" y2="312" stroke="#404760"/>
      <circle cx="542" cy="312" r="3.5"/>
      <line x1="539" y1="312" x2="545" y2="312" stroke="#404760"/>
    </g>

    <!-- Top Instrument Tabs (3 Channels with Roomy Typography) -->
    <g transform="translate(20, 22)">
      <!-- Channel 01: Court -->
      <g transform="translate(0, 0)">
        <rect width="164" height="52" rx="4" fill="#161824" stroke="#262b3c" stroke-width="1"/>
        <line x1="0" y1="0" x2="164" y2="0" stroke="#ff4f17" stroke-width="2.5"/>
        <circle cx="16" cy="19" r="3" fill="#ff4f17" class="anim-tab-pip"/>
        <text x="28" y="22" class="mono-bold" fill="#f3f5fa">01 // COURT</text>
        <text x="16" y="39" class="mono-meta" fill="#8a94a6">AST LINT TRIBUNAL</text>
      </g>

      <!-- Channel 02: Council -->
      <g transform="translate(176, 0)">
        <rect width="164" height="52" rx="4" fill="#11131e" stroke="#202434" stroke-width="1"/>
        <line x1="0" y1="0" x2="164" y2="0" stroke="#06b6d4" stroke-width="2"/>
        <circle cx="16" cy="19" r="3" fill="#06b6d4" class="anim-tab-pip"/>
        <text x="28" y="22" class="mono-bold" fill="#f3f5fa">02 // COUNCIL</text>
        <text x="16" y="39" class="mono-meta" fill="#8a94a6">4-WAY DIALECTIC</text>
      </g>

      <!-- Channel 03: Foundry -->
      <g transform="translate(352, 0)">
        <rect width="164" height="52" rx="4" fill="#11131e" stroke="#202434" stroke-width="1"/>
        <line x1="0" y1="0" x2="164" y2="0" stroke="#00e599" stroke-width="2"/>
        <circle cx="16" cy="19" r="3" fill="#00e599" class="anim-tab-pip"/>
        <text x="28" y="22" class="mono-bold" fill="#f3f5fa">03 // FOUNDRY</text>
        <text x="16" y="39" class="mono-meta" fill="#8a94a6">2,150+ RUNBOOKS</text>
      </g>
    </g>

    <!-- Telemetry Readout Matrix (Zero Collision Design with Pips and Safe Leader Line Boundaries) -->
    <g transform="translate(20, 94)">
      <!-- Row 1: Judicial Bench -->
      <g transform="translate(0, 18)">
        <circle cx="4" cy="-3" r="2" fill="#8a94a6"/>
        <text x="14" y="0" class="mono-meta" fill="#cbd3e1">JUDICIAL BENCH</text>
        <line x1="150" y1="-3" x2="240" y2="-3" stroke="#222738" class="anim-signal"/>
        <text x="516" y="0" text-anchor="end" class="mono-bold" fill="#f3f5fa">3 JURORS UNANIMOUS (AST)</text>
        <line x1="0" y1="12" x2="516" y2="12" stroke="#141722" stroke-width="0.8"/>
      </g>

      <!-- Row 2: Git Interceptor -->
      <g transform="translate(0, 48)">
        <circle cx="4" cy="-3" r="2" fill="#ff4f17"/>
        <text x="14" y="0" class="mono-meta" fill="#cbd3e1">GIT INTERCEPTOR</text>
        <line x1="150" y1="-3" x2="240" y2="-3" stroke="#ff4f17" stroke-opacity="0.4" class="anim-signal"/>
        <text x="516" y="0" text-anchor="end" class="mono-bold" fill="#ff4f17">BAILIFF PRE-COMMIT ARMED</text>
        <line x1="0" y1="12" x2="516" y2="12" stroke="#141722" stroke-width="0.8"/>
      </g>

      <!-- Row 3: Episodic Memory -->
      <g transform="translate(0, 78)">
        <circle cx="4" cy="-3" r="2" fill="#06b6d4"/>
        <text x="14" y="0" class="mono-meta" fill="#cbd3e1">EPISODIC MEMORY</text>
        <line x1="150" y1="-3" x2="240" y2="-3" stroke="#06b6d4" stroke-opacity="0.4" class="anim-signal"/>
        <text x="516" y="0" text-anchor="end" class="mono-bold" fill="#f3f5fa">OBSIDIAN VAULT // 7 NOTES</text>
        <line x1="0" y1="12" x2="516" y2="12" stroke="#141722" stroke-width="0.8"/>
      </g>

      <!-- Row 4: Slop Tolerance -->
      <g transform="translate(0, 108)">
        <circle cx="4" cy="-3" r="2" fill="#00e599"/>
        <text x="14" y="0" class="mono-meta" fill="#cbd3e1">SLOP TOLERANCE</text>
        <line x1="150" y1="-3" x2="240" y2="-3" stroke="#00e599" stroke-opacity="0.4" class="anim-signal"/>
        <text x="516" y="0" text-anchor="end" class="mono-bold" fill="#00e599">0.0% [ABSOLUTE ZERO]</text>
        <line x1="0" y1="12" x2="516" y2="12" stroke="#141722" stroke-width="0.8"/>
      </g>

      <!-- Row 5: Test Suite Matrix -->
      <g transform="translate(0, 138)">
        <circle cx="4" cy="-3" r="2" fill="#00e599"/>
        <text x="14" y="0" class="mono-meta" fill="#cbd3e1">CI TEST MATRIX</text>
        <line x1="150" y1="-3" x2="240" y2="-3" stroke="#00e599" stroke-opacity="0.4" class="anim-signal"/>
        <text x="516" y="0" text-anchor="end" class="mono-bold" fill="#00e599">43/43 PASSED [100% GREEN]</text>
      </g>
    </g>

    <!-- Bottom Chassis Cryptographic Clearance Strip (Generous Safe Margin) -->
    <g transform="translate(0, 290)">
      <rect width="556" height="36" rx="0 0 6 6" fill="#090a10"/>
      <line x1="0" y1="0" x2="556" y2="0" stroke="#181c28" stroke-width="1"/>
      <circle cx="16" cy="18" r="3" fill="#00e599" class="anim-pulse"/>
      <text x="26" y="22" class="mono-meta" fill="#687082">DOCKET: CR-2026 • CLEARANCE</text>
      <text x="536" y="22" text-anchor="end" class="mono-bold" fill="#00e599">ACQUITTED WITH HONORS</text>
    </g>
  </g>

  <!-- 6. Footer System Rail (Non-colliding, balanced metrics) -->
  <line x1="48" y1="434" x2="1152" y2="434" stroke="#181c28" stroke-width="1"/>
  <g transform="translate(48, 452)">
    <circle cx="4" cy="4" r="3" fill="#ff4f17"/>
    <text x="14" y="7.5" class="mono-bold" fill="#f3f5fa">APACHE 2.0</text>
    <text x="120" y="7.5" class="mono-meta">HARNESSES: CLAUDE • CURSOR • GEMINI • WINDSURF • OPENCODE • KILO</text>
    <text x="1104" y="7.5" text-anchor="end" class="mono-meta" fill="#8a94a6">FOUNDER: @SHOYARISM &amp; SYNTHETIC SWARM</text>
  </g>
</svg>