        <rect width="154" height="32" fill="#14161f" stroke="#25293a" stroke-width="1"/>
        <line x1="0" y1="0" x2="154" y2="0" stroke="#32374e" stroke-width="0.8"/>
        <text x="12" y="19.5" class="badge-label" fill="#f3f4f8">AST BAILIFF</text>
        <text x="96" y="19.5" class="mono-meta" fill="#8c92a4">GATE</text>
      </g>

      <!-- Badge 3 -->
