<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Matte Anodized Dark Graphite Ground -->
    <linearGradient id="ground" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111215"/>
      <stop offset="60%" stop-color="#141519"/>
      <stop offset="100%" stop-color="#0f1013"/>
    </linearGradient>

    <!-- The Single Pure Functional Accent: Signal Vermilion / Ochre -->
    <linearGradient id="vermilion" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eb5e28"/>
      <stop offset="100%" stop-color="#e0531c"/>
    </linearGradient>

    <!-- Crouwel-Saville 24px Modular Dot Matrix Grid -->
    <pattern id="modularGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#24262f"/>
    </pattern>

    <!-- Vertical Rhythm Ruler -->
    <pattern id="rulerLines" width="96" height="480" patternUnits="userSpaceOnUse">
      <line x1="96" y1="0" x2="96" y2="480" stroke="#1b1c22" stroke-width="0.8"/>
    </pattern>
  </defs>

  <style>
    .te-display { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Arial Black", sans-serif; font-weight: 900; letter-spacing: -2.5px; fill: #eceae4; text-transform: uppercase; }
    .te-mono { font-family: "SF Mono", "Consolas", Menlo, monospace; font-size: 10px; letter-spacing: 1.2px; fill: #8e919a; }
    .te-mono-bold { font-family: "SF Mono", "Consolas", monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; }
    .te-body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; font-weight: 400; font-size: 14.5px; fill: #b8bac2; line-height: 1.55; }
    .te-label { font-family: "SF Mono", monospace; font-size: 9px; letter-spacing: 1px; fill: #656770; text-transform: uppercase; }
  </style>

  <!-- 1. The Substrate Canvas -->
  <rect width="1200" height="480" fill="url(#ground)"/>
  <rect width="1200" height="480" fill="url(#rulerLines)"/>
  <rect width="1200" height="480" fill="url(#modularGrid)"/>

  <!-- 2. The Strict Swiss Structural Frame (Zero Rounded Corners) -->
  <rect x="24" y="24" width="1152" height="432" fill="none" stroke="#252730" stroke-width="1.2"/>

  <!-- 3. Precise Optical Registration Targets (Human Screenprint Calibration) -->
  <g stroke="#eb5e28" stroke-width="1" opacity="0.85">
    <circle cx="24" cy="24" r="5" fill="none"/>
    <line x1="15" y1="24" x2="33" y2="24"/>
    <line x1="24" y1="15" x2="24" y2="33"/>

    <circle cx="1176" cy="24" r="5" fill="none"/>
    <line x1="1167" y1="24" x2="1185" y2="24"/>
    <line x1="1176" y1="15" x2="1176" y2="33"/>

    <circle cx="24" cy="456" r="5" fill="none"/>
    <line x1="15" y1="456" x2="33" y2="456"/>
    <line x1="24" y1="447" x2="24" y2="465"/>

    <circle cx="1176" cy="456" r="5" fill="none"/>
    <line x1="1167" y1="456" x2="1185" y2="456"/>
    <line x1="1176" y1="447" x2="1176" y2="465"/>
  </g>

  <!-- 4. Top Technical Header Bar (Safely Contained with End-Anchored Right Block) -->
  <g transform="translate(48, 48)">
    <rect width="8" height="24" fill="#eb5e28"/>
    <text x="18" y="16.5" class="te-mono-bold" fill="#eceae4">SYS.ID // WORKSHOP.OS</text>

    <text x="280" y="16.5" class="te-mono">FORMAT: AUTONOMOUS RUNTIME</text>
    <text x="560" y="16.5" class="te-mono">MODULES: 960+ SKILLS</text>
    
    <!-- Right-Aligned with text-anchor="end" so it NEVER clips -->
    <text x="1104" y="16.5" text-anchor="end" class="te-mono-bold" fill="#eb5e28">ZERO-SLOP VERIFIED</text>
  </g>

  <!-- Structural Dividing Rail -->
  <line x1="48" y1="84" x2="1152" y2="84" stroke="#252730" stroke-width="1.2"/>

  <!-- 5. Main Typographic Body: Massive Brutalist Scale Contrast (Safely Contained on Left) -->
  <g transform="translate(48, 130)">
    <text x="0" y="0" class="te-label">SECTION 01 / SPECIFICATION</text>
    <line x1="160" y1="-3" x2="230" y2="-3" stroke="#eb5e28" stroke-width="1.2"/>

    <!-- Monumental Title: Tight tracking, solid bone white -->
    <text x="0" y="72" class="te-display" font-size="78">WORKSHOP</text>
    <text x="0" y="146" class="te-display" font-size="78" fill="#50535e">OS<tspan fill="#eb5e28">.</tspan></text>

    <!-- Manifesto Statement: Human, honest, uncompromising -->
    <text x="0" y="196" class="te-body">The irreducible operating foundation for AI coding agents.</text>
    <text x="0" y="222" class="te-body" fill="#8e919a">Deterministic AST gates, council dialectics &amp; persistent memory.</text>
  </g>

  <!-- 6. Right Side: Modular Instrument Chassis (Precisely Bound from x=600 to 1140) -->
  <g transform="translate(600, 108)">
    <!-- Container Box: Width 540, Height 294 -->
    <rect width="540" height="294" fill="#16171d" stroke="#2a2c36" stroke-width="1.2"/>

    <g transform="translate(24, 24)">
      <!-- 3 Chamfered Modular Blocks (Width 156 each, Gap 12) -->
      
      <!-- Block 1: Court -->
      <g transform="translate(0, 0)">
        <rect width="156" height="56" fill="url(#vermilion)"/>
        <text x="12" y="26" class="te-mono-bold" fill="#ffffff" font-size="12">01 // COURT</text>
        <text x="12" y="42" class="te-mono" fill="#ffffff" font-size="8.5">AST BAILIFF GATE</text>
      </g>

      <!-- Block 2: Council -->
      <g transform="translate(168, 0)">
        <polygon points="0,0 156,0 156,56 12,56 0,44" fill="#1e2028" stroke="#333644" stroke-width="1"/>
        <text x="14" y="26" class="te-mono-bold" fill="#eceae4" font-size="12">02 // COUNCIL</text>
        <text x="14" y="42" class="te-mono" font-size="8.5">4-WAY DIALECTIC</text>
      </g>

      <!-- Block 3: Foundry -->
      <g transform="translate(336, 0)">
        <rect width="156" height="56" fill="#eceae4"/>
        <text x="12" y="26" class="te-mono-bold" fill="#111215" font-size="12">03 // FOUNDRY</text>
        <text x="12" y="42" class="te-mono" fill="#555760" font-size="8.5">960+ RUNBOOKS</text>
      </g>

      <!-- Readout Data Table (Width 492px, perfectly contained) -->
      <g transform="translate(0, 80)">
        <!-- Row 1 -->
        <text x="0" y="16" class="te-mono" fill="#eceae4">TRIBUNAL BENCH</text>
        <text x="492" y="16" text-anchor="end" class="te-mono">3 JURORS UNANIMOUS</text>
        <line x1="0" y1="26" x2="492" y2="26" stroke="#252732" stroke-dasharray="2 4"/>

        <!-- Row 2 -->
        <text x="0" y="46" class="te-mono" fill="#eceae4">GIT INTERCEPTOR</text>
        <text x="492" y="46" text-anchor="end" class="te-mono-bold" fill="#eb5e28">BAILIFF PRE-COMMIT ACTIVE</text>
        <line x1="0" y1="56" x2="492" y2="56" stroke="#252732" stroke-dasharray="2 4"/>

        <!-- Row 3 -->
        <text x="0" y="76" class="te-mono" fill="#eceae4">EPISODIC MEMORY</text>
        <text x="492" y="76" text-anchor="end" class="te-mono">OBSIDIAN 2ND BRAIN // ADRs</text>
        <line x1="0" y1="86" x2="492" y2="86" stroke="#252732" stroke-dasharray="2 4"/>

        <!-- Row 4 -->
        <text x="0" y="106" class="te-mono" fill="#eceae4">SLOP TOLERANCE</text>
        <text x="492" y="106" text-anchor="end" class="te-mono-bold" fill="#eceae4">0.0% (ABSOLUTE ZERO)</text>
      </g>
    </g>

    <!-- Bottom Chassis Metadata Strip -->
    <rect x="0" y="268" width="540" height="26" fill="#111216"/>
    <text x="16" y="284" class="te-label" fill="#8e919a">DOCKET: CR-20261028 • CLEARANCE: SHA-256 VERIFIED</text>
  </g>

  <!-- 7. Bottom Horizontal Rail & System Footer -->
  <line x1="48" y1="424" x2="1152" y2="424" stroke="#252730" stroke-width="1.2"/>

  <g transform="translate(48, 442)">
    <circle cx="4" cy="4" r="3" fill="#eb5e28"/>
    <text x="18" y="7.5" class="te-mono-bold" fill="#eceae4">APACHE 2.0 OPEN SOURCE</text>

    <text x="360" y="7.5" class="te-mono">MULTI-HARNESS: CLAUDE • CURSOR • GEMINI • WINDSURF</text>
    <text x="1104" y="7.5" text-anchor="end" class="te-mono">AUTHOR: @SHOYARISM &amp; SWARM</text>
  </g>
</svg>
