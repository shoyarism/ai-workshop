        <line x1="0" y1="0" x2="166" y2="0" stroke="#32374e" stroke-width="0.8"/>
        <text x="12" y="19.5" class="badge-label" fill="#10b981">0.0% SLOP</text>
        <text x="96" y="19.5" class="mono-meta" fill="#8c92a4">VERIFIED</text>
