        <line x1="0" y1="0" x2="162" y2="0" stroke="#505672" stroke-width="1.5"/>
        <text x="14" y="22" class="mono-bold" fill="#f3f4f8">02 // COUNCIL</text>
        <text x="14" y="38" class="mono-meta" fill="#8c92a4">4-WAY DIALECTIC</text>
      </g>

      <!-- Channel 03 -->
      <g transform="translate(344, 0)">
        <rect width="162" height="52" fill="#141620" stroke="#262939" stroke-width="1"/>
        <line x1="0" y1="0" x2="162" y2="0" stroke="#505672" stroke-width="1.5"/>
        <text x="14" y="22" class="mono-bold" fill="#f3f4f8">03 // FOUNDRY</text>
        <text x="14" y="38" class="mono-meta" fill="#8c92a4">2,150+ RUNBOOKS</text>
      </g>
    </g>

    <!-- Telemetry Readout Matrix -->
    <g transform="translate(24, 94)">
      <!-- Row 1 -->
      <g transform="translate(0, 18)">
        <text x="0" y="0" class="mono-meta" fill="#cbd0e0">JUDICIAL BENCH</text>
        <line x1="120" y1="-3" x2="310" y2="-3" stroke="#202330" stroke-dasharray="2 4"/>
        <text x="506" y="0" text-anchor="end" class="mono-bold" fill="#f3f4f8">3 JURORS UNANIMOUS (AST)</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 48)">
        <text x="0" y="0" class="mono-meta" fill="#cbd0e0">GIT INTERCEPTOR</text>
        <line x1="126" y1="-3" x2="330" y2="-3" stroke="#202330" stroke-dasharray="2 4"/>
        <text x="506" y="0" text-anchor="end" class="mono-bold" fill="#ff5722">BAILIFF PRE-COMMIT ARMED</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 78)">
        <text x="0" y="0" class="mono-meta" fill="#cbd0e0">EPIDEMIC MEMORY</text>
        <line x1="130" y1="-3" x2="330" y2="-3" stroke="#202330" stroke-dasharray="2 4"/>
        <text x="506" y="0" text-anchor="end" class="mono-bold" fill="#f3f4f8">OBSIDIAN VAULT // 7 NOTES</text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(0, 108)">
        <text x="0" y="0" class="mono-meta" fill="#cbd0e0">SLOP INDEX TOLERANCE</text>
        <line x1="168" y1="-3" x2="340" y2="-3" stroke="#202330" stroke-dasharray="2 4"/>
        <text x="506" y="0" text-anchor="end" class="mono-bold" fill="#10b981">0.0% (ABSOLUTE ZERO)</text>
      </g>

      <!-- Row 5 -->
      <g transform="translate(0, 138)">
        <text x="0" y="0" class="mono-meta" fill="#cbd0e0">TEST COVERAGE BASELINE</text>
        <line x1="178" y1="-3" x2="380" y2="-3" stroke="#202330" stroke-dasharray="2 4"/>
        <text x="506" y="0" text-anchor="end" class="mono-bold" fill="#10b981">41.4% (GATE: &gt;= 40.0%)</text>
      </g>
    </g>

    <!-- Bottom Chassis Strip -->
    <g transform="translate(0, 276)">
      <rect width="554" height="32" fill="#0d0e14"/>
      <line x1="0" y1="0" x2="554" y2="0" stroke="#1d202c" stroke-width="1"/>
      <text x="24" y="20" class="mono-meta" fill="#656c82">CLEARANCE: CR-20261029-7D08 • SHA-256 SIGNED</text>
      <text x="530" y="20" text-anchor="end" class="mono-bold" fill="#10b981">ACQUITTED</text>
    </g>
  </g>

  <!-- 6. Footer System Rail -->
  <line x1="48" y1="432" x2="1152" y2="432" stroke="#1d202c" stroke-width="1.2"/>
  <g transform="translate(48, 452)">
    <circle cx="4" cy="3" r="3" fill="#ff5722"/>
    <text x="16" y="7" class="mono-bold" fill="#f3f4f8">APACHE 2.0 OPEN SOURCE</text>
    <text x="260" y="7" class="mono-meta">HARNESSES: CLAUDE CODE • CURSOR • GEMINI • WINDSURF • OPENCODE • KILO</text>
    <text x="1104" y="7" text-anchor="end" class="mono-meta" fill="#8c92a4">FOUNDER: @SHOYARISM &amp; SYNTHETIC SWARM</text>
  </g>
</svg>
