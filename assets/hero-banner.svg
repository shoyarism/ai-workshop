      <line x1="11" y1="14" x2="17" y2="14" stroke="#484f6a"/>
      <circle cx="540" cy="14" r="4"/>
      <line x1="537" y1="14" x2="543" y2="14" stroke="#484f6a"/>
      <circle cx="14" cy="294" r="4"/>
      <line x1="11" y1="294" x2="17" y2="294" stroke="#484f6a"/>
