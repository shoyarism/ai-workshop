<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <!-- =================================================================
       WORKSHOP OS Hero Banner v3.5
       Apple Minimalist Design Language
       Reference: Apple Human Interface Guidelines 2025
       ================================================================= -->
  <defs>
    <!-- Apple-style color palette -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfdfd"/>
      <stop offset="100%" stop-color="#f7f6f3"/>
    </linearGradient>

    <!-- Apple accent blue -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0062FF"/>
    </linearGradient>

    <!-- Success green -->
    <linearGradient id="success" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34C759"/>
      <stop offset="100%" stop-color="#26a846"/>
    </linearGradient>

    <!-- Typography with SF Pro system fonts -->
    <style>
      .mono-meta { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 12px; letter-spacing: 0.5px; fill: #888888; }
      .mono-bold { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; fill: #111111; }
      .body-muted { font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 12px; fill: #555555; }
      .title-display { font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
      .body-lead { font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 14px; fill: #111111; line-height: 1.4; }
      .badge-label { font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 11px; font-weight: 500; }
      .section-title { font-family: "SF Pro Display", Georgia, serif; font-weight: 800; font-size: 20px; fill: #111111; letter-spacing: -0.01em; }
      .section-tag { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; fill: #555555; }
      .mono-meta-alt { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 10px; fill: #888888; letter-spacing: 0.5px; }
      .mono-bold-alt { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; }
      .verdict-title { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 11px; font-weight: 800; letter-spacing: 1px; }
      .verdict-line { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 11px; fill: #555555; }
      .juror-title { font-family: "SF Pro Display", Georgia, serif; font-weight: 800; font-size: 14px; fill: #111111; letter-spacing: -0.01em; }
      .juror-tag { font-family: "SF Mono", "Geist Mono", Consolas, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; fill: #555555; }
      .item-bullet { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-weight: 500; font-size: 11px; fill: #555555; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad)"/>

  <!-- Left margin whitespace -->
  <rect x="0" y="0" width="120" height="600" fill="#fdfdfd"/>

  <!-- Structural divider -->
  <line x1="120" y1="0" x2="120" y2="600" stroke="#e5e5e5" stroke-width="0.5" opacity="0.3"/>

  <!-- Main content -->
  <g transform="translate(120, 0)">
    <!-- Header: Version badge -->
    <g transform="translate(0, 48)">
      <!-- Clean white badge with subtle border -->
      <rect x="-2" y="-14" width="140" height="28" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="0.5"/>
      <circle cx="12" cy="0" r="3.5" fill="url(#accent)"/>
      <text x="24" y="6" class="mono-meta">WORKSHOP OS v3.5</text>
    </g>

    <!-- Hero Title - SF Pro Display style -->
    <g transform="translate(0, 120)">
      <text x="0" y="0" class="title-display">
        <tspan font-weight="800" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="52" fill="#111111">WORKSHOP</tspan>
        <tspan x="0" dy="1.2em" font-weight="200" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="52" fill="#555555"> OPERATING</tspan>
        <tspan x="0" dy="1.1em" font-weight="800" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="44" fill="#111111">OS</tspan>
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 260)">
      <text x="0" y="0" class="body-lead">
        <tspan>The irreducible operating foundation for AI coding agents.</tspan>
        <tspan x="0" dy="1.4em" class="body-muted">Converts stochastic model drift into deterministic code invariants through recursive AST arrest, adversarial councils, and episodic memory.</tspan>
      </text>
    </g>

    <!-- Specification badges - Apple style -->
    <g transform="translate(0, 350)">
      <!-- Badge 1: Verified -->
      <g transform="translate(0, 0)">
        <rect x="-2" y="-16" width="152" height="32" rx="6" fill="#e8f5e9" stroke="#e5e5e5" stroke-width="0.5"/>
        <line x1="0" y1="0" x2="152" y2="0" stroke="#346538" stroke-width="1.5"/>
        <text x="14" y="0" class="badge-label" fill="#111111">7 HOUSES</text>
        <text x="142" y="0" text-anchor="end" class="mono-meta">GUILDS</text>
      </g>

      <!-- Badge 2: Court -->
      <g transform="translate(168, 0)">
        <rect x="-2" y="-16" width="142" height="32" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="0.5"/>
        <circle cx="10" cy="0" r="3" fill="url(#accent)"/>
        <text x="22" y="0" class="badge-label" fill="#111111">01 // COURT</text>
        <text x="130" y="0" text-anchor="end" class="mono-meta">SLOP TRIBUNAL</text>
      </g>

      <!-- Badge 3: Council -->
      <g transform="translate(340, 0)">
        <rect x="-2" y="-16" width="142" height="32" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="0.5"/>
        <circle cx="10" cy="0" r="3" fill="#6b7280"/>
        <text x="22" y="0" class="badge-label" fill="#111111">02 // COUNCIL</text>
        <text x="130" y="0" text-anchor="end" class="mono-meta">DIALECTIC</text>
      </g>

      <!-- Badge 4: Zero Slop -->
      <g transform="translate(502, 0)">
        <rect x="-2" y="-16" width="164" height="32" rx="6" fill="#e8f5e9" stroke="#e5e5e5" stroke-width="0.5"/>
        <line x1="0" y1="0" x2="164" y2="0" stroke="#346538" stroke-width="1.5"/>
        <text x="16" y="0" class="badge-label" fill="#111111">0.0% SLOP</text>
        <text x="146" y="0" text-anchor="end" class="mono-meta">VERIFIED</text>
      </g>
    </g>
  </g>

  <!-- Right column: Terminal window (Apple-style) -->
  <g transform="translate(840, 48)">
    <!-- Terminal window with subtle shadow -->
    <g transform="translate(0, 0)">
      <rect width="340" height="280" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="0.5"/>
      <!-- Window controls - Apple style -->
      <circle cx="20" cy="20" r="4" fill="#ff5f56"/>
      <circle cx="30" cy="20" r="4" fill="#ffbd2e"/>
      <circle cx="40" cy="20" r="4" fill="#27c93f"/>
      <!-- Title bar -->
      <text x="54" y="24" class="mono-meta">TERMINAL: VERIFICATION RUN</text>
      <!-- Terminal content -->
      <text x="24" y="58" class="mono-bold" fill="#111111">$</text>
      <text x="38" y="58" class="mono-bold">workshop doctor --strict</text>
      <rect x="150" y="48" width="16" height="11" fill="#111111"/>
      <text x="400" y="58" text-anchor="end" class="mono-bold" fill="#346538">[PASS: 43/43]</text>

      <!-- Output lines with subtle dividers -->
      <text x="24" y="86" class="body-muted">PATHS.................... OK</text>
      <text x="24" y="104" class="body-muted">PIPES..................... OK</text>
      <text x="24" y="122" class="body-muted">CORE SKILLS............... OK</text>
      <text x="24" y="140" class="body-muted">SLOP COURT................ OK</text>
    </g>

    <!-- Footer metrics -->
    <g transform="translate(0, 334)">
      <line x1="0" y1="0" x2="340" y2="0" stroke="#e5e5e5" stroke-width="0.5"/>
      <text x="0" y="22" class="mono-meta" fill="#555555">BUILD: C85A0C37 • TRUSTED</text>
      <text x="160" y="22" text-anchor="middle" class="mono-meta" fill="#555555">CATALOG: 2,267+ SKILLS • MIT LICENSE</text>
      <text x="340" y="22" text-anchor="end" class="mono-meta" fill="#555555">SLOP INDEX: 0.0%</text>
    </g>
  </g>

  <!-- Horizontal footer -->
  <line x1="120" y1="592" x2="1140" y2="592" stroke="#e5e5e5" stroke-width="0.5"/>
</svg>