[project]
name = "photoreal-studio"
version = "2.0.0"
description = "First-principles photographic optical physics engine and high-resolution FLUX.1 synthesis studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "gradio_client>=1.0.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
