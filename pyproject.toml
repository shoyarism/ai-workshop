[project]
name = "workshop-os"
version = "3.5.0"
description = "Universal AI Workshop OS — Master Engineering Arsenal & Multi-Agent Supreme Tribunal"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
]

[project.scripts]
workshop = "scripts.workshop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
    "fastmcp",
    "fastapi",
    "uvicorn",
    "websockets",
]
browser = [
    "playwright",
    "crawl4ai",
]
vision = [
    "pillow",
    "gradio-client",
]
agents = [
    "mem0ai",
    "pydantic-ai",
    "agno",
    "smolagents",
]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "pip-audit",
    "mypy",
]
all = [
    "mcp>=1.0.0",
    "fastmcp",
    "fastapi",
    "uvicorn",
    "websockets",
    "pillow",
    "playwright",
    "gradio-client",
    "crawl4ai",
    "mem0ai",
    "pydantic-ai",
    "agno",
    "smolagents",
    "ruff",
    "pytest",
    "pytest-cov",
    "pip-audit",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
norecursedirs = [
    ".git",
    "node_modules",
    "skills",
    "vault",
    "data",
    "evidence_quarantine",
    "dist",
    "build",
    "*.egg-info",
    "integration",
]

[tool.coverage.run]
source = ["scripts"]
omit = [
    "scripts/experimental/*",
    "scripts/workshop_vision.py",
    "scripts/workshop_reasoning_eval.py",
    "scripts/workshop_osint.py",
    "scripts/workshop_forensics.py",
    "scripts/workshop_hf.py",
    "scripts/workshop_openrouter.py",
    "scripts/workshop_desktop.py",
    "scripts/workshop_routine.py",
    "scripts/workshop_semantic_indexer.py",
    "scripts/workshop_search.py",
    "scripts/workshop_services.py",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    "node_modules",
    "skills",
    "vault",
    "data",
    "evidence_quarantine",
    "scripts/experimental",
    "evals",
]

[tool.ruff.lint]
select = ["F"]



