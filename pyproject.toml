[project]
name = "workshop-os"
version = "3.5.0"
description = "Universal AI Workshop OS — Master Engineering Arsenal & Multi-Agent Supreme Tribunal"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
    "fastmcp",
    "fastapi",
    "uvicorn",
    "websockets",
]
browser = [
    "playwright",
    "crawl4ai",
]
vision = [
    "pillow",
    "gradio-client",
]
agents = [
    "mem0ai",
    "pydantic-ai",
    "agno",
    "smolagents",
]
dev = [
    "ruff",
    "pytest",
]
all = [
    "mcp>=1.0.0",
    "fastmcp",
    "fastapi",
    "uvicorn",
    "websockets",
    "pillow",
    "playwright",
