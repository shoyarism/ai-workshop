name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ⚖️ Slop Court & System Verification (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install hatchling pyyaml pydantic requests ruff pytest pytest-cov pip-audit mypy
          pip install -e .

      - name: Verify CLI entrypoint and package import
        run: |
          workshop --help
          python -c "import scripts"

      - name: Run Unit Test Suite with Coverage Gate
        run: |
          pytest --cov=scripts.workshop --cov=scripts.agent_runtime --cov=scripts.agent_watchdog --cov-fail-under=40 tests

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          python -m pip install --upgrade certifi
          pip-audit --local --skip-editable --desc || pip-audit --skip-editable --desc
        continue-on-error: true

      - name: Static Type Check Quality Gate (mypy)
        run: |
          mypy --ignore-missing-imports scripts/workshop_court.py scripts/workshop_skills.py scripts/workshop_sync.py

      - name: Enforce Code Linter (Ruff)
        run: |
          ruff check --select F,E9,W6,B006,B008 scripts tests

      - name: Run Slop Court Quality Tribunal on Scripts
        run: |
          python scripts/workshop_court.py trial scripts

      - name: Verify Secret & Credential Invariants
        run: |
          python scripts/scan_secrets.py

      - name: Run Workshop Doctor Diagnostics (--strict)
        run: |
          python scripts/workshop.py doctor --strict

      - name: Verify Agent Instruction Drift Gate
        run: |
          python scripts/workshop_sync.py --check
